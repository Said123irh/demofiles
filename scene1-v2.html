<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>False Awakening Scene 1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#000;display:block}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(0,0,0,.82);color:#e8e2d6;font:600 22px system-ui,Arial,sans-serif;cursor:pointer;letter-spacing:.06em;text-align:center;padding:0 16px}
#ov small{font:400 14px system-ui,Arial,sans-serif;opacity:.6;letter-spacing:.02em}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ov"><div id="ovt">CLICK TO PLAY WITH SOUND</div><small>False Awakening, Scene 1 &middot; about 51 seconds &middot; Space pauses &middot; R restarts</small></div>
<script>
(()=>{
const W=1280,H=720,BAR=64,SH=H-2*BAR,CX=W/2,CY=SH/2,DUR=46,TAU=Math.PI*2,OL='#1c1e26';
const cv=document.getElementById('cv');cv.width=W;cv.height=H;
const main=cv.getContext('2d');
let c=main;

/* ================= helpers ================= */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>clamp(Math.round(v*k),0,255);return'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')'}
function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function fillOL(fill,lw=5){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=OL;c.lineJoin='round';c.stroke()}
function capOut(x1,y1,x2,y2,w,lw=5){c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=OL;c.lineWidth=w+lw*2;c.stroke()}
function capFill(x1,y1,x2,y2,w,fill){c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=fill;c.lineWidth=w;c.stroke()}
function cap(x1,y1,x2,y2,w,fill,lw=5){capOut(x1,y1,x2,y2,w,lw);capFill(x1,y1,x2,y2,w,fill)}
function glow(x,y,r,rgb,a,mode='screen'){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(1,'rgba('+rgb+',0)');c.save();c.globalCompositeOperation=mode;c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore()}
function lin(x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
// draw several shapes as one silhouette: all outlines first, then all fills
function group(paths,fill,lw=5){paths.forEach(p=>{p();c.lineWidth=lw*2;c.strokeStyle=OL;c.lineJoin='round';c.stroke()});paths.forEach(p=>{p();c.fillStyle=fill;c.fill()})}
// offscreen layer, used for depth-of-field blur and soft eyelids
const off=document.createElement('canvas');off.width=W/2;off.height=SH/2;const octx=off.getContext('2d');
const blC=document.createElement('canvas');blC.width=W/2;blC.height=SH/2;const bl=blC.getContext('2d');
function blurred(fn,px,base){
  if(base){c.fillStyle=base;c.fillRect(-W,-SH,W*3,SH*3)}
  const m=c.getTransform(),prev=c;
  octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,W/2,SH/2);
  octx.setTransform(m.a/2,m.b/2,m.c/2,m.d/2,m.e/2,(m.f-BAR)/2);
  c=octx;fn();c=prev;
  bl.setTransform(1,0,0,1,0,0);bl.globalCompositeOperation='copy';bl.filter='blur('+(px*0.45)+'px)';bl.drawImage(off,0,0);bl.filter='none';
  c.save();c.setTransform(1,0,0,1,0,BAR);c.drawImage(blC,0,0,W,SH);c.restore();
}

/* ================= characters ================= */
const ETHAN={skin:'#e8b894',shirt:'#8a8f9a',pants:'#2f3d57',hair:'#5a3b26',kind:'ethan'};
const DAD={skin:'#e3b08c',shirt:'#8f4a3a',pants:'#2b2d36',hair:'#b8bcc4',kind:'dad',long:true};
const MOM={skin:'#e8b894',shirt:'#7a8f6a',pants:'#3d4f6b',hair:'#6b4a32',kind:'mom',long:true};

function face(K,e){
  const brow=e.brow||0,eye=e.eye==null?1:e.eye,pup=e.pup==null?1:e.pup,op=e.open||0,sm=e.smile||0,lk=e.look||0,bl=e.blink||0,ly=e.lookY||0;
  // blush
  [-1,1].forEach(i=>{c.beginPath();c.ellipse(i*25,-236,8,4.5,0,0,TAU);c.fillStyle='rgba(225,110,100,.28)';c.fill()});
  [-1,1].forEach(i=>{
    const ex=i*17,ey=-254,rx=9.5*eye,ry=rx*(1-bl*0.92);
    c.lineCap='round';
    if(bl>0.85){c.beginPath();c.arc(ex,ey-3,9,0.25,Math.PI-0.25);c.lineWidth=4;c.strokeStyle=OL;c.stroke()}
    else{
      c.beginPath();c.ellipse(ex,ey,rx,ry,0,0,TAU);c.fillStyle='#f7f4ee';c.fill();c.lineWidth=3.2;c.strokeStyle=OL;c.stroke();
      c.save();c.beginPath();c.ellipse(ex,ey,rx,ry,0,0,TAU);c.clip();
      const px=ex+lk*4,py=ey+1+ly*3,pr=4.4*pup*Math.min(eye,1.2);
      c.beginPath();c.arc(px,py,pr,0,TAU);c.fillStyle=OL;c.fill();
      c.beginPath();c.arc(px-pr*0.4,py-pr*0.45,Math.max(1,pr*0.33),0,TAU);c.fillStyle='#fff';c.fill();
      c.restore();
    }
    const by=-273-(eye-1)*8;
    c.beginPath();c.moveTo(i*7,by-brow*8);c.lineTo(i*30,by+brow*8);c.lineWidth=6.5;c.strokeStyle=K==='dad'?'#8d9099':(K==='mom'?'#4a3020':'#2a1a10');c.stroke();
    if(e.stress){c.beginPath();c.arc(ex,ey+9,7,0.5,Math.PI-0.5);c.lineWidth=2;c.strokeStyle='rgba(28,30,38,.5)';c.stroke()}
  });
  c.beginPath();c.moveTo(-2,-247);c.quadraticCurveTo(-7,-236,1,-236);c.lineWidth=3.2;c.strokeStyle=OL;c.stroke();
  if(op>0.05){
    const mw=9+op*6,mh=2.5+op*13,my=-224+op*3;
    c.save();c.beginPath();c.ellipse(0,my,mw,mh,0,0,TAU);c.fillStyle='#4a1c26';c.fill();c.clip();
    c.beginPath();c.ellipse(0,my+mh*0.75,mw*0.7,mh*0.5,0,0,TAU);c.fillStyle='#c4606a';c.fill();
    if(op>0.35){c.fillStyle='#f4efe6';c.fillRect(-mw,my-mh,mw*2,mh*0.32)}
    c.restore();c.beginPath();c.ellipse(0,my,mw,mh,0,0,TAU);c.lineWidth=3.5;c.strokeStyle=OL;c.stroke();
  }else{c.beginPath();c.moveTo(-11,-224);c.quadraticCurveTo(0,-224+sm*10,11,-224);c.lineWidth=4;c.strokeStyle=OL;c.stroke()}
  if(e.sweat){c.beginPath();c.moveTo(36,-280);c.quadraticCurveTo(45,-264,37,-259);c.quadraticCurveTo(28,-264,36,-280);c.fillStyle='#b9d6f2';c.fill();c.lineWidth=2.5;c.strokeStyle=OL;c.stroke();
    c.beginPath();c.arc(35,-266,1.6,0,TAU);c.fillStyle='#fff';c.fill()}
}
function spikePath(th,len,w=0.2){return()=>{c.beginPath();c.moveTo(Math.cos(th-w)*42,-254+Math.sin(th-w)*42);c.lineTo(Math.cos(th+0.12)*len,-254+Math.sin(th+0.12)*len);c.lineTo(Math.cos(th+w)*42,-254+Math.sin(th+w)*42);c.closePath()}}
const ETHAN_SPIKES=[[-0.14,62],[-0.27,70],[-0.4,66],[-0.52,72],[-0.64,67],[-0.77,70],[-0.88,62]].map(a=>spikePath(Math.PI*a[0]*1-0,a[1]));
function napePath(){c.beginPath();c.arc(0,-254,46,1.05,Math.PI-1.05,true);
  c.quadraticCurveTo(-14,-206,-6,-211);c.quadraticCurveTo(0,-205,6,-211);c.quadraticCurveTo(14,-206,23,-214);c.closePath()}

function headBack(o){
  const K=o.kind,hair=o.hair,hairD=shade(hair,0.78),hairL=shade(hair,1.18);
  if(K==='mom'){c.beginPath();c.arc(0,-300,21,0,TAU);fillOL(hair)}
  rr(-13,-228,26,30,7);fillOL(o.skin,4.5);
  [-1,1].forEach(i=>{c.beginPath();c.arc(i*43,-250,11,0,TAU);fillOL(o.skin,4.5)});
  c.beginPath();c.arc(0,-252,44,0,TAU);fillOL(o.skin);
  const parts=[napePath];if(K==='ethan')parts.push(...ETHAN_SPIKES);
  group(parts,hair);
  c.save();napePath();c.clip();
  c.beginPath();c.arc(16,-246,44,0,TAU);c.fillStyle=hairD;c.fill();
  c.beginPath();c.arc(-6,-258,40,0,TAU);c.fillStyle=hair;c.fill();
  c.lineCap='round';
  if(K==='dad'){c.lineWidth=2.2;c.strokeStyle=shade(hair,0.8);c.globalAlpha=0.7;for(let k=-3;k<=3;k++){c.beginPath();c.moveTo(k*8+6,-292+Math.abs(k)*3);c.quadraticCurveTo(k*14+10,-256,k*12+2,-218+Math.abs(k)*4);c.stroke()}c.globalAlpha=1}
  if(K==='mom'){c.lineWidth=2.4;c.strokeStyle=hairD;for(let k=-4;k<=4;k++){if(!k)continue;c.beginPath();c.moveTo(k*8,-212+Math.abs(k)*3);c.quadraticCurveTo(k*10,-258,k*2,-292);c.stroke()}}
  c.beginPath();c.arc(-4,-258,32,Math.PI*1.12,Math.PI*1.42);c.lineWidth=6;c.strokeStyle=hairL;c.globalAlpha=0.7;c.stroke();c.globalAlpha=1;
  c.restore();
  napePath();c.lineWidth=5;c.strokeStyle=OL;c.stroke();
  if(K==='mom'){c.beginPath();c.arc(0,-300,21,0,TAU);fillOL(hair);c.beginPath();c.arc(-5,-304,12,Math.PI*1.1,Math.PI*1.6);c.lineWidth=4;c.strokeStyle=hairL;c.stroke();
    c.beginPath();c.moveTo(-19,-284);c.quadraticCurveTo(0,-279,19,-284);c.lineWidth=6;c.strokeStyle='#8a5a3a';c.stroke()}
}
function headFront(o){
  const K=o.kind,hair=o.hair,skinD=shade(o.skin,0.86);
  if(K==='mom'){c.beginPath();c.arc(0,-301,21,0,TAU);fillOL(hair)}
  rr(-13,-228,26,30,7);fillOL(skinD,4.5);
  [-1,1].forEach(i=>{c.beginPath();c.arc(i*43,-250,11,0,TAU);fillOL(o.skin,4.5);c.beginPath();c.arc(i*44,-250,5,i>0?-1.4:1.7,i>0?1.4:4.6);c.lineWidth=2;c.strokeStyle='rgba(28,30,38,.45)';c.stroke()});
  c.beginPath();c.arc(0,-252,44,0,TAU);c.fillStyle=o.skin;c.fill();
  c.save();c.beginPath();c.arc(0,-252,44,0,TAU);c.clip();c.fillStyle=skinD;c.fillRect(-50,-300,100,100);c.beginPath();c.arc(-7,-257,44,0,TAU);c.fillStyle=o.skin;c.fill();c.restore();
  c.beginPath();c.arc(0,-252,44,0,TAU);c.lineWidth=5;c.strokeStyle=OL;c.stroke();
  if(K==='ethan'){
    const cap=()=>{c.beginPath();c.arc(0,-254,47,Math.PI+0.2,-0.2);[[41,-266],[33,-280],[24,-272],[14,-284],[4,-275],[-8,-285],[-18,-275],[-28,-283],[-41,-266]].forEach(p=>c.lineTo(p[0],p[1]));c.closePath()};
    group([cap,...ETHAN_SPIKES],hair);
    c.save();c.beginPath();c.arc(0,-254,47,Math.PI+0.2,-0.2);c.lineWidth=5;c.strokeStyle=shade(hair,1.25);c.globalAlpha=0;c.restore();
    c.beginPath();c.arc(-6,-262,30,Math.PI*1.15,Math.PI*1.4);c.lineWidth=5;c.lineCap='round';c.strokeStyle=shade(hair,1.3);c.stroke();
  }
  if(K==='dad'){
    const cap=()=>{c.beginPath();c.arc(0,-254,47,Math.PI+0.3,-0.3);c.quadraticCurveTo(26,-282,6,-286);c.quadraticCurveTo(-24,-284,-44,-268);c.closePath()};
    const tl=()=>{c.beginPath();c.ellipse(-41,-262,8,16,0.2,0,TAU)},tr=()=>{c.beginPath();c.ellipse(41,-262,8,16,-0.2,0,TAU)};
    group([cap,tl,tr],hair,4.5);
  }
  if(K==='mom'){
    const cap=()=>{c.beginPath();c.arc(0,-254,48,Math.PI+0.05,-0.05);c.lineTo(47,-232);c.quadraticCurveTo(40,-250,36,-262);c.quadraticCurveTo(6,-262,-14,-274);c.quadraticCurveTo(-30,-262,-38,-246);c.lineTo(-47,-232);c.closePath()};
    group([cap],hair);
    c.beginPath();c.moveTo(-14,-274);c.quadraticCurveTo(10,-290,30,-292);c.lineWidth=2.5;c.strokeStyle=shade(hair,0.75);c.stroke();
  }
  face(K,o.expr||{});
  if(K==='dad'){
    [-1,1].forEach(i=>{c.beginPath();c.arc(i*19,-254,16,0,TAU);c.fillStyle='rgba(255,255,255,.15)';c.fill();c.lineWidth=4;c.strokeStyle=OL;c.stroke()});
    c.beginPath();c.moveTo(-3,-256);c.lineTo(3,-256);c.stroke();
    c.beginPath();c.moveTo(-17,-231);c.quadraticCurveTo(0,-241,17,-231);c.quadraticCurveTo(0,-224,-17,-231);fillOL('#a5a9b2',3.5);
  }
}

function person(o){
  const s=o.s||1,back=!!o.back,ph=o.walk||0,A=o.fold?[0.32,0.32]:(o.arms||[0.12,0.12]),F=o.fold?[-1.75,-1.75]:(o.fore||A),K=o.kind,skin=o.skin,shirtD=shade(o.shirt,0.8);
  c.save();c.translate(o.x,o.y);c.scale(o.flip?-s:s,s);
  if(o.shadow){c.beginPath();c.ellipse(0,4,95,15,0,0,TAU);c.fillStyle='rgba(15,12,10,.3)';c.fill()}
  if(o.rot)c.rotate(o.rot);
  if(o.cut!=null){c.beginPath();c.rect(-500,-900,1000,900+o.cut);c.clip()}
  const sw=o.stride==null?0.5:o.stride;
  const legs=[-1,1].map(i=>{const p=ph+(i<0?0:Math.PI),a=Math.sin(p)*sw,hx=i*17,hy=-118,lift=Math.max(0,Math.cos(p))*(o.lift||0);return{i,hx,hy,fx:hx+Math.sin(a)*112,fy:hy+Math.cos(a)*112-lift}});
  legs.forEach(l=>capOut(l.hx,l.hy,l.fx,l.fy-6,30));
  legs.forEach(l=>capFill(l.hx,l.hy,l.fx,l.fy-6,30,o.pants));
  legs.forEach(l=>capFill(l.hx+7,l.hy+6,l.fx+7,l.fy-10,7,shade(o.pants,0.8)));
  legs.forEach(l=>{c.beginPath();c.ellipse(l.fx+(back?0:3),l.fy+5,24,12,0,0,TAU);fillOL('#2a2b33',4.5);c.beginPath();c.ellipse(l.fx-3,l.fy+1,10,4,0,0,TAU);c.fillStyle='#4a4c58';c.fill()});
  c.save();c.translate(0,-(o.breath||0));
  const arms=[-1,1].map((i,k)=>{const a=A[k],f=F[k],sx=i*40,sy=-192,ex=sx+i*Math.sin(a)*54,ey=sy+Math.cos(a)*54;return{i,sx,sy,ex,ey,hx:ex+i*Math.sin(f)*50,hy:ey+Math.cos(f)*50}});
  if(o.fold&&back){arms.forEach(m=>capOut(m.ex,m.ey,m.hx,m.hy,20));arms.forEach(m=>capFill(m.ex,m.ey,m.hx,m.hy,20,o.shirt))}
  rr(-38,-136,76,30,10);fillOL(o.pants);
  // torso with cel shading
  rr(-38,-208,76,94,26);c.fillStyle=o.shirt;c.fill();
  c.save();rr(-38,-208,76,94,26);c.clip();
  c.fillStyle=shirtD;c.fillRect(16,-215,30,110);c.fillStyle='rgba(0,0,0,.08)';c.fillRect(-40,-128,80,16);
  if(K==='dad'){
    c.lineWidth=4;c.strokeStyle='#6e3326';[-26,-8,10,28].forEach(x=>{c.beginPath();c.moveTo(x,-210);c.lineTo(x,-112);c.stroke()});
    [-188,-162,-136].forEach(y=>{c.beginPath();c.moveTo(-40,y);c.lineTo(40,y);c.stroke()});
    c.lineWidth=2.2;c.strokeStyle='#b06a55';[-17,1,19].forEach(x=>{c.beginPath();c.moveTo(x,-210);c.lineTo(x,-112);c.stroke()});[-175,-149].forEach(y=>{c.beginPath();c.moveTo(-40,y);c.lineTo(40,y);c.stroke()});
    if(!back){c.beginPath();c.moveTo(0,-206);c.lineTo(0,-114);c.lineWidth=3;c.strokeStyle=OL;c.stroke();[-190,-168,-146].forEach(y=>{c.beginPath();c.arc(-5,y,2.5,0,TAU);c.fillStyle='#e8dcc8';c.fill()})}
    else{c.beginPath();c.moveTo(-26,-206);c.quadraticCurveTo(0,-196,26,-206);c.lineWidth=3;c.strokeStyle=OL;c.stroke()}
  }else if(K==='mom'){
    if(!back){c.fillStyle='#d8dccb';c.beginPath();c.moveTo(-16,-208);c.lineTo(16,-208);c.lineTo(8,-150);c.lineTo(-8,-150);c.closePath();c.fill();
      c.lineWidth=3.5;c.strokeStyle=OL;c.beginPath();c.moveTo(-16,-208);c.lineTo(-6,-114);c.moveTo(16,-208);c.lineTo(6,-114);c.stroke()}
    c.lineWidth=2;c.strokeStyle='rgba(40,50,30,.35)';for(let y=-196;y<-118;y+=8){c.beginPath();c.moveTo(-40,y);c.lineTo(40,y);c.stroke()}
    c.lineWidth=5;c.strokeStyle=shade('#7a8f6a',0.78);c.beginPath();c.moveTo(-40,-122);c.lineTo(40,-122);c.stroke();
  }else{
    if(!back){c.beginPath();c.arc(0,-210,15,0.1,Math.PI-0.1);c.lineWidth=4;c.strokeStyle='#5f646e';c.stroke()}
    else{c.beginPath();c.moveTo(-14,-206);c.quadraticCurveTo(0,-200,14,-206);c.lineWidth=3.5;c.strokeStyle='#5f646e';c.stroke()}
  }
  c.restore();
  rr(-38,-208,76,94,26);c.lineWidth=5;c.strokeStyle=OL;c.stroke();
  // arms
  if(o.fold&&back){
    arms.forEach(m=>capOut(m.sx,m.sy,m.ex,m.ey,23));arms.forEach(m=>{capFill(m.sx,m.sy,m.ex,m.ey,23,o.shirt);c.fillStyle=shirtD;c.beginPath();c.arc(m.ex,m.ey,7,0,TAU);c.fill()});
  }else{
  arms.forEach(m=>{capOut(m.sx,m.sy,m.ex,m.ey,23);capOut(m.ex,m.ey,m.hx,m.hy,20)});
  arms.forEach(m=>{capFill(m.sx,m.sy,m.ex,m.ey,23,o.shirt);capFill(m.ex,m.ey,m.hx,m.hy,20,o.long?o.shirt:skin);
    if(!o.long){c.beginPath();c.moveTo(m.ex-9,m.ey-4);c.lineTo(m.ex+9,m.ey+4);c.lineWidth=3;c.strokeStyle='rgba(28,30,38,.5)';c.stroke()}});
  arms.forEach(m=>{c.beginPath();c.ellipse(m.hx-m.i*11,m.hy-7,6,9,-m.i*0.5,0,TAU);fillOL(skin,4);c.beginPath();c.arc(m.hx,m.hy,15,0,TAU);fillOL(skin,4.5)});
  if(o.mug){const m=arms[o.mug===-1?0:1];rr(m.hx-14,m.hy-36,30,38,7);fillOL('#d9d3c4',4.5);c.fillStyle='rgba(0,0,0,.1)';c.fillRect(m.hx+6,m.hy-33,6,32);
    c.beginPath();c.arc(m.hx+18,m.hy-17,9,-1.2,1.2);c.lineWidth=5;c.strokeStyle=OL;c.stroke();c.fillStyle='#4a2f1e';c.fillRect(m.hx-11,m.hy-33,24,6);
    c.beginPath();c.arc(m.hx,m.hy,15,Math.PI*0.9,Math.PI*2.1);fillOL(skin,4.5)}
  }
  if(back)headBack(o);else headFront(o);
  c.restore();
  c.restore();
}

/* ================= pseudo 3D hallway ================= */
const HALL_ITEMS=[];
[['door',-1,230,80],['frame',1,300,55],['lamp',0,180,50],['frame',-1,400,55],['door',1,470,80],['lamp',0,420,50],['frame',1,610,55],['door',-1,650,80],['lamp',0,660,50],['frame',-1,790,55],['door',1,820,80],['lamp',0,900,50],['door',-1,980,80],['frame',1,1000,55]]
  .forEach((a,i)=>HALL_ITEMS.push({type:a[0],side:a[1],z:a[2],len:a[3],pic:i}));

function hall(P,camZ,fx){
  const F=520,zEnd=fx.zEnd,vx=CX+(fx.sway||0),vy=CY-10+(fx.bob||0),Wd=190,top=-175,flo=150,rail=30;
  const pr=(x,y,z)=>{z=Math.max(z,6);const k=F/z;return[vx+x*k,vy+y*k,k]};
  const quad=(pts,fill,ol)=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();if(ol){c.lineWidth=ol;c.strokeStyle=OL;c.lineJoin='round';c.stroke()}};
  const line=(a,b,col,lw)=>{c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.strokeStyle=col;c.lineWidth=lw;c.stroke()};
  const zf=zEnd-camZ,zn=6;
  c.fillStyle=P.back;c.fillRect(-200,-200,W+400,SH+400);
  quad([pr(-Wd,top,zn),pr(Wd,top,zn),pr(Wd,top,zf),pr(-Wd,top,zf)],P.ceil);
  quad([pr(-Wd,flo,zn),pr(Wd,flo,zn),pr(Wd,flo,zf),pr(-Wd,flo,zf)],P.floor);
  [-1,1].forEach(s=>{
    quad([pr(s*Wd,top,zn),pr(s*Wd,flo,zn),pr(s*Wd,flo,zf),pr(s*Wd,top,zf)],s<0?P.wallL:P.wallR);
    quad([pr(s*Wd,rail,zn),pr(s*Wd,flo,zn),pr(s*Wd,flo,zf),pr(s*Wd,rail,zf)],P.wain);
  });
  // wallpaper stripes and wainscot panels
  c.lineCap='butt';
  for(let z=Math.ceil((camZ+8)/26)*26;z<zEnd;z+=26){const zr=z-camZ;[-1,1].forEach(s=>line(pr(s*Wd,top,zr),pr(s*Wd,rail,zr),'rgba(110,70,40,0.13)',Math.max(0.6,2.2*F/zr/3)))}
  for(let z=Math.ceil((camZ+8)/70)*70;z<zEnd;z+=70){const zr=z-camZ;[-1,1].forEach(s=>line(pr(s*Wd,rail+14,zr),pr(s*Wd,flo-30,zr),'rgba(28,30,38,0.28)',Math.max(0.6,3*F/zr/3)))}
  [-1,1].forEach(s=>{quad([pr(s*Wd,rail-5,zn),pr(s*Wd,rail+5,zn),pr(s*Wd,rail+5,zf),pr(s*Wd,rail-5,zf)],P.trim);quad([pr(s*Wd,flo-20,zn),pr(s*Wd,flo,zn),pr(s*Wd,flo,zf),pr(s*Wd,flo-20,zf)],P.trim)});
  // floor boards + runner
  for(let x=-180;x<=180;x+=30)line(pr(x,flo,8),pr(x,flo,zf),'rgba(40,25,15,0.22)',1.5);
  quad([pr(-74,flo,zn),pr(74,flo,zn),pr(74,flo,zf),pr(-74,flo,zf)],P.runnerB);
  quad([pr(-64,flo,zn),pr(64,flo,zn),pr(64,flo,zf),pr(-64,flo,zf)],P.runner);
  // end wall + bright door
  const a=pr(-Wd,top,zf),b=pr(Wd,flo,zf);
  c.fillStyle=P.end;c.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
  const d1=pr(-62,-122,zf),d2=pr(62,flo,zf);
  c.fillStyle=P.trim;c.fillRect(d1[0]-6*d1[2],d1[1]-6*d1[2],d2[0]-d1[0]+12*d1[2],d2[1]-d1[1]+6*d1[2]);
  c.fillStyle=P.endDoor;c.fillRect(d1[0],d1[1],d2[0]-d1[0],d2[1]-d1[1]);
  c.lineWidth=Math.max(2,1.4*d1[2]);c.strokeStyle=OL;c.strokeRect(d1[0],d1[1],d2[0]-d1[0],d2[1]-d1[1]);
  // items far to near
  fx.items.slice().sort((p,q)=>q.z-p.z).forEach(it=>{
    const z1=it.z-camZ,z2=it.z+it.len-camZ;if(z2<10||z1>zf+5)return;
    const s=it.side,x=s*Wd,k=F/Math.max(z1,10),lw=clamp(3.2*k/1.6,1.2,8);
    if(it.type==='door'){
      quad([pr(x,-128,z1-7),pr(x,-128,z2+7),pr(x,flo,z2+7),pr(x,flo,z1-7)],P.trim,lw);
      quad([pr(x,-116,z1),pr(x,-116,z2),pr(x,flo,z2),pr(x,flo,z1)],P.door,lw);
      quad([pr(x,-96,z1+12),pr(x,-96,z2-12),pr(x,-16,z2-12),pr(x,-16,z1+12)],P.doorIn,lw*.6);
      quad([pr(x,4,z1+12),pr(x,4,z2-12),pr(x,124,z2-12),pr(x,124,z1+12)],P.doorIn,lw*.6);
      const kn=pr(x,40,z2-10);c.beginPath();c.arc(kn[0],kn[1],Math.max(2,5*kn[2]/1.5),0,TAU);fillOL('#d9c28a',lw*.5);
    }else if(it.type==='frame'){
      quad([pr(x,-78,z1),pr(x,-78,z2),pr(x,-6,z2),pr(x,-6,z1)],P.frame,lw);
      quad([pr(x,-68,z1+7),pr(x,-68,z2-7),pr(x,-16,z2-7),pr(x,-16,z1+7)],P.pic[it.pic%P.pic.length],lw*.5);
      quad([pr(x,-44,z1+14),pr(x,-44,z1+28),pr(x,-16,z1+28),pr(x,-16,z1+14)],P.picB,0);
      quad([pr(x,-36,z1+30),pr(x,-36,z1+42),pr(x,-16,z1+42),pr(x,-16,z1+30)],P.picB,0);
    }else if(it.type==='lamp'){
      quad([pr(-34,top+1,z1),pr(34,top+1,z1),pr(34,top+1,z2),pr(-34,top+1,z2)],P.lamp,lw*.6);
      const pc=pr(0,flo,z1+25);glow(pc[0],pc[1],Math.min(900,150*pc[2]),P.pool,0.32);
    }
  });
  glow(vx,vy,fx.fogR||620,P.fog,P.fogA);
  const e=pr(0,0,zf);glow(e[0],e[1],fx.bloomR||300,P.endGlow,0.85);
}

function steam(x,y,u,n,sc,alpha=0.5){
  c.save();c.lineCap='round';
  for(let i=0;i<n;i++){
    const ph=(u*0.45+i/n)%1,yy=y-ph*130*sc,xx=x+Math.sin(u*1.7+i*2.1+ph*5)*10*sc*(0.4+ph)+(i-(n-1)/2)*7*sc;
    c.globalAlpha=alpha*Math.sin(ph*Math.PI);c.strokeStyle='#f2eee6';c.lineWidth=7*sc*(1-ph*0.45);
    c.beginPath();c.moveTo(xx,yy);c.bezierCurveTo(xx+12*sc*Math.sin(u*2+i),yy-14*sc,xx-12*sc*Math.sin(u*1.6+i),yy-28*sc,xx+2*sc,yy-44*sc);c.stroke();
  }
  c.restore();
}
function dust(u,n,col='255,240,205'){
  c.save();
  for(let i=0;i<n;i++){const x=((hash(i)*W+Math.sin(u*0.5+i)*30+u*(6+hash(i+9)*10))%W+W)%W,y=((hash(i+50)*SH-u*(5+hash(i+3)*8))%SH+SH)%SH,r=1.2+hash(i+7)*2.6;
    c.globalAlpha=0.2+0.5*hash(i+20)*(0.5+0.5*Math.sin(u*1.3+i));c.fillStyle='rgb('+col+')';c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
  c.restore();
}
function blobs(y,r,col,off,step=95){c.fillStyle=col;for(let i=-2;i<17;i++){const q=r*(0.7+0.6*hash(i+off));c.beginPath();c.ellipse(i*step+hash(i+off+3)*40,y-q*0.2,q*0.9,q,0,0,TAU);c.fill()}c.fillRect(-300,y,W+600,260)}
function clockFace(x,y,r,hh,mm,ss){
  c.beginPath();c.arc(x,y,r*1.08,0,TAU);fillOL('#3c4252',Math.max(3,r/11));
  c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle='#ecebe4';c.fill();
  c.save();c.beginPath();c.arc(x,y,r,0,TAU);c.clip();c.beginPath();c.arc(x+r*0.12,y+r*0.12,r,0,TAU);c.rect(x-r*2,y-r*2,r*4,r*4);c.fillStyle='rgba(0,0,0,.08)';c.fill('evenodd');c.restore();
  c.lineCap='round';c.strokeStyle=OL;
  for(let i=0;i<60;i++){const a=i/60*TAU,big=i%5===0;c.lineWidth=big?Math.max(2,r/16):Math.max(1,r/60);c.beginPath();c.moveTo(x+Math.sin(a)*r*(big?0.78:0.86),y-Math.cos(a)*r*(big?0.78:0.86));c.lineTo(x+Math.sin(a)*r*0.9,y-Math.cos(a)*r*0.9);c.stroke()}
  const ha=((hh%12)+mm/60)/12*TAU,ma=(mm+ss/60)/60*TAU;
  c.lineWidth=Math.max(3,r/9);c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.sin(ha)*r*0.5,y-Math.cos(ha)*r*0.5);c.stroke();
  c.lineWidth=Math.max(2.5,r/13);c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.sin(ma)*r*0.74,y-Math.cos(ma)*r*0.74);c.stroke();
  const sa=Math.floor(ss)/60*TAU;c.strokeStyle='#b3352c';c.lineWidth=Math.max(1.5,r/26);c.beginPath();c.moveTo(x-Math.sin(sa)*r*0.15,y+Math.cos(sa)*r*0.15);c.lineTo(x+Math.sin(sa)*r*0.82,y-Math.cos(sa)*r*0.82);c.stroke();
  c.beginPath();c.arc(x,y,r/15,0,TAU);c.fillStyle='#b3352c';c.fill();
  c.beginPath();c.arc(x,y,r,0,TAU);c.lineWidth=Math.max(2,r/22);c.strokeStyle=OL;c.stroke();
}

function fan(cx,cy,rx,sy,ang,ghost=3){
  c.save();c.translate(cx,cy);c.scale(1,sy);
  for(let g=ghost;g>=0;g--){
    c.save();c.rotate(ang-g*0.15);c.globalAlpha=g?0.18:1;
    for(let b=0;b<4;b++){c.save();c.rotate(b*TAU/4);rr(36,-36,rx-36,72,36);fillOL('#6b5a4a',g?0:6);
      if(!g){c.fillStyle='rgba(255,255,255,.08)';rr(50,-30,rx-60,18,9);c.fill();c.strokeStyle='rgba(40,30,20,.35)';c.lineWidth=3;for(let k=1;k<4;k++){c.beginPath();c.moveTo(60,-20+k*10);c.lineTo(rx-30,-20+k*10);c.stroke()}}
      c.restore()}
    c.restore();
  }
  c.beginPath();c.arc(0,0,rx*0.18,0,TAU);fillOL('#3c3d46',6);
  c.beginPath();c.arc(0,0,rx*0.125,0,TAU);c.fillStyle='#f4f2e8';c.fill();c.lineWidth=4;c.strokeStyle=OL;c.stroke();

function grassTuft(x,y,h,u,col){c.save();c.translate(x,y);c.strokeStyle=col;c.lineCap='round';c.lineWidth=3;for(let k=-2;k<=2;k++){const sw=Math.sin(u*1.5+x*0.05)*4;c.beginPath();c.moveTo(k*3,0);c.quadraticCurveTo(k*4+sw*0.5,-h*0.5,k*6+sw,-h*(0.7+0.3*hash(x+k)));c.stroke()}c.restore()}

function cam(u,d,o){
  const p=ease(u/d);
  c.translate(CX,CY);
  c.translate(Math.sin(u*0.7)*(o.drift||0)+lerp(o.x0||0,o.x1||0,p),Math.cos(u*0.5)*(o.drift||0)*0.7+lerp(o.y0||0,o.y1||0,p));
  c.rotate(Math.sin(u*0.4)*(o.roll||0.002));
  const z=lerp(o.z0||1,o.z1||1,p);c.scale(z,z);
  c.translate(-(o.fx==null?CX:o.fx),-(o.fy==null?CY:o.fy));
}

const whiteAlpha=t=>t<M(16.6)?0:t<M(17.9)?ease(seg(t,M(16.6),M(17.9))):t<M(18.4)?1:1-ease(seg(t,M(18.4),M(19.7)));
function subtitle(t){
  const L=LINES.find(l=>t>=l.t0-0.1&&t<=l.t1);if(!L)return;
  const a=Math.min(seg(t,L.t0-0.1,L.t0+0.15),1-seg(t,L.t1-0.3,L.t1));
  c.save();c.globalAlpha=a;c.font='600 26px "Segoe UI",system-ui,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle=L.col;
  c.fillText(L.who+':  '+L.text,CX,H-BAR/2);c.restore();
}
function render(t){
  t=clamp(t,0,DUR-0.001);c=main;
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#000';c.fillRect(0,0,W,H);
  c.save();c.translate(0,BAR);c.beginPath();c.rect(0,0,W,SH);c.clip();
  if(t<DUR-2){
    drawShot(t);
    post(t);
    const wa=whiteAlpha(t);if(wa>0){c.fillStyle='rgba(255,250,235,'+wa+')';c.fillRect(0,0,W,SH)}
    if(t<0.9){c.fillStyle='rgba(0,0,0,'+(1-seg(t,0,0.9))+')';c.fillRect(0,0,W,SH)}
    c.save();c.globalCompositeOperation='overlay';c.globalAlpha=0.16;c.drawImage(grainTex[Math.floor(t*14)%6],Math.floor(hash(Math.floor(t*14))*60)-30,0);c.restore();
  }
  c.restore();
  c.fillStyle='#000';c.fillRect(0,0,W,BAR);c.fillRect(0,H-BAR,W,BAR);
  subtitle(t);
}

/* ================= sound (all synthesised) ================= */
let AC=null,t0=0;
function buildAudio(){
  const ac=AC;t0=ac.currentTime+0.15;
  const comp=ac.createDynamicsCompressor(),master=ac.createGain();master.gain.value=0.85;master.connect(comp);comp.connect(ac.destination);
  const out=ac.createGain();out.connect(master);
  // generated room reverb
  const ir=ac.createBuffer(2,ac.sampleRate*2.8,ac.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.6)}
  const verb=ac.createConvolver();verb.buffer=ir;const wet=ac.createGain();wet.gain.value=0.6;verb.connect(wet);wet.connect(master);
  const T0=x=>t0+M(x);
  master.gain.setValueAtTime(0.85,T0(48.99));master.gain.setValueAtTime(0.0001,T0(49));
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  function G(t,a,d,pk,hold=0,dst=out,rev=0){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.setValueAtTime(pk,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+d);g.connect(dst);if(rev){const s=ac.createGain();s.gain.value=rev;g.connect(s);s.connect(verb)}return g}
  function tone(type,f,t,a,d,pk,{hold=0,f2,rev=0}={}){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+hold+d);o.connect(G(t,a,d,pk,hold,out,rev));o.start(t);o.stop(t+a+hold+d+0.1)}
  function noise(t,a,d,pk,{type='lowpass',f=800,q=1,f2,hold=0,rev=0}={}){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+a+hold+d);fl.Q.value=q;s.connect(fl);fl.connect(G(t,a,d,pk,hold,out,rev));s.start(t,Math.random());s.stop(t+a+hold+d+0.1)}
  function bell(t,f,pk){[[1,1],[2.76,0.35],[5.4,0.15]].forEach(p=>tone('sine',f*p[0],t,0.005,3.2/Math.sqrt(p[0]),pk*p[1],{rev:1.2}))}
  function voice(t,f0,dur,pk){const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0*1.06,t);o.frequency.linearRampToValueAtTime(f0*0.94,t+dur);
    const g=G(t,0.02,dur*0.7,pk,dur*0.2,out,0.25);[[650,4],[1700,6]].forEach(fm=>{const b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=fm[0];b.Q.value=fm[1];o.connect(b);b.connect(g)});o.start(t);o.stop(t+dur+0.4)}
  const heart=(t,pk=0.5)=>{tone('sine',58,T0(t),0.01,0.16,pk,{f2:40});tone('sine',52,T0(t+0.16),0.01,0.14,pk*0.72,{f2:38})};
  // dream: drone, bells, footsteps, wind chime, porch breeze
  [55,82.4,110.5].forEach((f,i)=>tone(i?'triangle':'sine',f,T0(0),3,3,0.07-i*0.015,{hold:9,rev:0.4}));
  [0.8,3.6,5.9,8.3,10.6,13.2,15.5].forEach((t,i)=>bell(T0(t),[659,784,880,659,988,784,523][i],0.07));
  for(let t=0.3;t<3.9;t+=0.58)noise(t0+t,0.005,0.09,0.2,{f:220,rev:0.5});
  noise(T0(7.5),2,3,0.05,{type:'bandpass',f:420,q:0.6,hold:6});
  [8.9,9.4,10.1,11.6].forEach((t,i)=>tone('sine',[2093,2637,2349,3136][i],T0(t),0.003,1.6,0.025,{rev:1}));
  let hb=14.4,gap=0.85;while(hb<17.9){heart(hb);hb+=gap;gap=Math.max(0.5,gap-0.045)}
  noise(T0(16.4),1.4,0.5,0.18,{type:'bandpass',f:300,q:1,f2:5000,rev:0.6});tone('sine',440,T0(16.6),1.2,0.5,0.06,{f2:1320,rev:0.8});
  // wake up
  noise(T0(19.3),0.7,0.7,0.1,{type:'bandpass',f:1300,q:0.7});
  [19.7,20.35,21.0,21.7].forEach(t=>heart(t,0.48));
  noise(T0(18.4),1.5,5,0.07,{f:260,hold:6});tone('sine',95,T0(18.8),1.5,1,0.035,{hold:5});
  for(let t=22.4;t<49;t+=1)if(t<26.2||t>29.7)tone('square',Math.floor(t)%2?3200:2600,T0(t),0.001,0.025,0.018,{rev:0.2});
  // whips, run, breath
  [26.1,29.4].forEach(t=>noise(T0(t),0.12,0.18,0.22,{type:'bandpass',f:500,q:0.8,f2:4500}));
  for(let t=M(26.3)+0.1;t<M(29.6)-0.1;t+=0.27)noise(t0+t,0.004,0.07,0.28,{type:'bandpass',f:900,q:0.8,rev:0.3});
  [26.6,27.9,29.2].forEach(t=>noise(T0(t),0.25,0.3,0.07,{type:'bandpass',f:1500,q:0.8}));
  // kitchen room tone, kettle, fridge hum
  noise(T0(29.6),1,19,0.03,{f:380});noise(T0(30),3,16,0.016,{type:'highpass',f:4500});tone('sine',60,T0(29.6),1,1,0.04,{hold:18});
  [30.5,31.4,32.3].forEach(t=>noise(T0(t),0.2,0.35,0.06,{type:'bandpass',f:1400,q:0.8}));
  // dread drone
  tone('sawtooth',41,T0(34),8,6,0.07);tone('sawtooth',43.5,T0(34),8,6,0.05);tone('sine',82,T0(36),6,3,0.06);
  LINES.forEach((L,li)=>L.syl.forEach(s=>voice(T0(L.t0+s[0]),li?210:128,s[1],0.12)));
  for(let t=37.6;t<43;t+=0.62)heart(t,0.3);
  tone('sine',30,T0(44),3,2,0.12,{hold:0});
}

/* ================= player ================= */
const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),q=new URLSearchParams(location.search);
let playing=false,startPerf=0;
const now=()=>AC?AC.currentTime-t0:(performance.now()-startPerf)/1000;
function start(){
  ov.style.display='none';
  try{AC=new (window.AudioContext||window.webkitAudioContext)();buildAudio()}catch(e){AC=null}
  startPerf=performance.now();playing=true;requestAnimationFrame(loop);
}
function stop(){playing=false;if(AC){AC.close();AC=null}}
function loop(){
  if(!playing)return;
  const t=now();render(t);
  if(t>=DUR){stop();ov.style.display='flex';ovt.textContent='REPLAY';return}
  requestAnimationFrame(loop);
}
ov.addEventListener('click',()=>{stop();start()});
addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){stop();start()}
  if(e.key===' '&&AC){e.preventDefault();AC.state==='running'?AC.suspend():AC.resume()}
});
window.renderAt=render;
if(q.has('t')){ov.style.display='none';render(parseFloat(q.get('t'))||0)}else render(3);
})();
</script>
