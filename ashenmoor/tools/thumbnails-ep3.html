<title>Ashenmoor Episode 3 Thumbnails</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b1024}
body{background:var(--bg);margin:0;padding-block:16px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
canvas{display:block;width:100%;max-width:1280px;height:auto;aspect-ratio:16/9}
</style>
<canvas id="t1" width="1280" height="720"></canvas>
<canvas id="t2" width="1280" height="720"></canvas>
<script>
// Sprite data is pasted from assets/sprites/sprites-hd.json by the build step (window.SPRITES_HD). Drawn on the fine grid: one buffer pixel = one sprite pixel.
(function(){
const S=window.SPRITES_HD,W=1280,H=720,BW=160,BH=90,K=8;
const rnd=s=>{const v=Math.sin(s*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const lerp=(a,b,k)=>a+(b-a)*k;
function mk(rows,pal){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const col=pal[r[i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1)}}});return c}
function rotCW(src){const c=document.createElement('canvas');c.width=src.height;c.height=src.width;const x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(src,0,0);return c}
function makeSit(stand){const Wd=stand.width,legs=document.createElement('canvas');legs.width=Wd;legs.height=stand.height-27;legs.getContext('2d').drawImage(stand,0,-27);
  const L=rotCW(legs),c=document.createElement('canvas');c.width=44;c.height=27;const x=c.getContext('2d');x.drawImage(L,0,13,L.width,9,2,18,L.width,9);x.drawImage(stand,0,0,Wd,27,12,0,Wd,27);return c}
const WICK=mk(S.wick.frames.idle,S.wick.palette),SEN=mk(S.sentry.frames.idle,S.sentry.palette),OSW=mk(S.oswin.frames.idle,S.oswin.palette),SIT=makeSit(OSW);
function buffer(){const c=document.createElement('canvas');c.width=BW;c.height=BH;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g]}
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
// darkness with soft stepped holes for lights, then additive glow
function lightUp(g,dark,lights){
  const [lc,lg]=buffer();lg.fillStyle='rgba(4,6,20,'+dark+')';lg.fillRect(0,0,BW,BH);lg.globalCompositeOperation='destination-out';
  for(const [x,y,r,s] of lights){const gr=lg.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(0,0,0,'+s+')');gr.addColorStop(.5,'rgba(0,0,0,'+s*.55+')');gr.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=gr;lg.fillRect(x-r,y-r,r*2,r*2)}
  const id=lg.getImageData(0,0,BW,BH),d=id.data;for(let i=3;i<d.length;i+=4)d[i]=Math.round(d[i]/42)*42;lg.putImageData(id,0,0);
  g.drawImage(lc,0,0);
}
function glow(m,x,y,r,col,a){const gr=m.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+col+','+a+')');gr.addColorStop(1,'rgba('+col+',0)');m.fillStyle=gr;m.fillRect(x-r,y-r,r*2,r*2)}
function flame(g,x,y){R(g,x,y+1,1,2,'#ffd25a');R(g,x,y,1,1,'#fff6c8')}
// big outlined headline text
function headline(m,lines,x,y,size,align){
  m.save();m.textAlign=align||'left';m.textBaseline='top';m.lineJoin='round';
  lines.forEach((ln,i)=>{let cx=x;const yy=y+i*size*1.02;m.font=size+'px Anton, Impact, sans-serif';
    const total=ln.reduce((a,[t])=>a+m.measureText(t).width,0);if(align==='right')cx=x-total;else if(align==='center')cx=x-total/2;m.textAlign='left';
    for(const [t,col] of ln){m.lineWidth=size*.16;m.strokeStyle='#05060f';m.strokeText(t,cx,yy);m.fillStyle=col;m.fillText(t,cx,yy);cx+=m.measureText(t).width}});
  m.restore();
}
function badge(m,text,x,y,size,bg,fg){m.save();m.font=size+'px Anton, Impact, sans-serif';const w=m.measureText(text).width+size*.9,h=size*1.35;
  m.translate(x,y);m.rotate(-.05);m.fillStyle='#05060f';m.fillRect(6,8,w,h);m.fillStyle=bg;m.fillRect(0,0,w,h);m.fillStyle=fg;m.textBaseline='middle';m.fillText(text,size*.45,h/2+2);m.restore()}

function stone(g,top,bot){R(g,0,top,BW,bot-top,'#1c2238');for(let j=top;j<bot;j+=12){R(g,0,j,BW,2,'#141a2c');for(let i=((j-top)/12)%2?12:0;i<BW;i+=24)R(g,i,j,2,12,'#141a2c')}}
// Wick on the fine grid, lantern held out at his chest (never above his head). Returns the flame.
function wick(g,x,gy,swing){const y=gy-32;g.drawImage(WICK,x,y);const P=(a,b,w,h,c)=>R(g,x+a,y+b,w||1,h||1,c);
  const ty=17+(swing||0);for(let k=1;k<5;k++)P(22+k,Math.round(lerp(22,ty,k/5)),1,1,'#7a5530');P(27,ty,1,1,'#7a5530');
  P(26,ty+1,7,1,'#2e2218');P(26,ty+11,7,1,'#2e2218');P(26,ty+1,1,11,'#2e2218');P(32,ty+1,1,11,'#2e2218');P(27,ty+2,5,9,'#3a2a1a');
  return [x+29,y+ty+6]}
function wickFlame(g,f){R(g,f[0],f[1]-2,1,6,'#ffd25a');R(g,f[0]-1,f[1]-1,1,4,'#ffb347');R(g,f[0]+1,f[1]-1,1,4,'#ffb347');R(g,f[0],f[1],1,2,'#fff6c8')}
function vignette(m,cx,cy){const v=m.createRadialGradient(cx,cy,H*.3,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');m.fillStyle=v;m.fillRect(0,0,W,H)}

/* Thumbnail A: Sir Oswin sits bolt upright on his bier, eyes blazing; Wick leaps back */
function thumb1(){
  const [c,g]=buffer();
  stone(g,0,80);R(g,0,80,BW,10,'#262838');R(g,0,80,BW,2,'#363a4c');
  R(g,84,68,74,12,'#4a4656');R(g,82,65,78,4,'#5c586a');R(g,82,65,78,1,'#6e6a7e');R(g,88,76,6,4,'#2a2834');R(g,148,76,6,4,'#2a2834');
  const f=wick(g,22,76,-2);
  lightUp(g,.8,[[f[0],f[1],40,1],[118,48,44,.55]]);
  g.globalAlpha=.92;g.drawImage(SIT,96,39);g.globalAlpha=1;           // the ghost glows, so it sits above the dark
  for(const ex of [21,27]){R(g,96+ex,47,2,2,'#38c8ff');R(g,96+ex,47,1,1,'#e8fbff')}
  const foot=[99,61],ring=[152,64],n=Math.ceil(Math.hypot(ring[0]-foot[0],ring[1]-foot[1]));
  for(let i=0;i<=n;i++){const k=i/n,x=lerp(foot[0],ring[0],k),y=lerp(foot[1],ring[1],k);R(g,x,y,1,1,i%3?'#bfe6ff':'#ffffff')}
  R(g,foot[0]-2,foot[1]-1,4,3,'#ffffff');R(g,ring[0]-1,ring[1]-1,3,3,'#5a5462');
  wickFlame(g,f);
  const m=document.getElementById('t1').getContext('2d');m.imageSmoothingEnabled=false;m.drawImage(c,0,0,W,H);
  m.globalCompositeOperation='lighter';glow(m,f[0]*K,f[1]*K,280,'255,160,70',.4);glow(m,118*K,56*K,300,'120,200,255',.28);glow(m,125*K,47*K,60,'90,210,255',.35);m.globalCompositeOperation='source-over';
  vignette(m,W*.6,H*.6);
  headline(m,[[["HE'S",'#ffffff']],[["AWAKE!",'#ffb347']]],44,26,160,'left');
  badge(m,'100 YEARS ASLEEP',760,150,46,'#8fd0ff','#06101c');
}

/* Thumbnail B: the Sentry salutes so hard his helmet slips over one eye; Wick looks up at his new friend */
function thumb2(){
  const [c,g]=buffer();
  stone(g,0,82);R(g,0,82,BW,8,'#2a2c3a');R(g,0,82,BW,2,'#3c3e50');
  R(g,128,22,32,60,'#2c2c40');R(g,134,30,26,52,'#06050a');            // the open door behind him
  const sx=100,sy=35;g.drawImage(SEN,sx,sy);
  const hx=sx+3,hy=sy+29;for(let k=1;k<=30;k++){const y=hy-k;R(g,hx,y,1,1,k<=4?'#4a3020':k<=6?'#8a7a64':k>28?'#e8ecf4':'#a8aebc');if(k===5){R(g,hx-1,y,3,1,'#8a7a64')}}
  R(g,sx+6,sy+5,7,5,'#6e6876');R(g,sx+6,sy+5,7,1,'#9690a2');R(g,sx+6,sy+10,7,1,'#4a4552');  // helmet slipped over one eye
  const f=wick(g,40,82,1);
  lightUp(g,.8,[[f[0],f[1],40,1],[sx+15,sy+9,18,.7],[sx+16,sy+30,26,.7],[147,80,22,.6]]);
  R(g,sx+14,sy+8,1,2,'#5aa8e0');R(g,sx+15,sy+8,1,2,'#e6f6ff');
  g.globalAlpha=.6;R(g,136,79,22,2,'#ffcc66');g.globalAlpha=1;
  wickFlame(g,f);
  const m=document.getElementById('t2').getContext('2d');m.imageSmoothingEnabled=false;m.drawImage(c,0,0,W,H);
  m.globalCompositeOperation='lighter';glow(m,f[0]*K,f[1]*K,300,'255,160,70',.42);glow(m,(sx+15)*K,(sy+9)*K,140,'110,200,255',.6);glow(m,147*K,80*K,220,'255,200,90',.3);m.globalCompositeOperation='source-over';
  vignette(m,W*.55,H*.6);
  headline(m,[[["SKELETON",'#ffffff']],[["FRIEND?",'#ffb347']]],44,26,150,'left');
  badge(m,'YOU VOTED: TALK',56,350,46,'#8fd0ff','#06101c');
}
const go=()=>{thumb1();thumb2();window.__done=true};
(document.fonts?document.fonts.load('150px Anton').then(go,go):go());
})();
</script>
