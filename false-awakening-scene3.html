<title>False Awakening Scene 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one cinema frame, a slim transport bar and a note. Dark-first, single look. */
:root{
  --bg:#0c0d0f; --surface:#17191d; --fg:#ece8e1; --muted:#9a968f; --line:#2a2d33;
  --accent:#d98a3d; --accent-fg:#16110b;
  --display:'Dela Gothic One','Impact',sans-serif;
  --body:'Zen Kaku Gothic New','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,32px);margin:0;line-height:1.1;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);max-width:62ch}
.frame{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border:0;cursor:pointer;color:var(--fg);font:inherit;width:100%}
.big span{background:var(--accent);color:var(--accent-fg);font-weight:700;padding:14px 26px;border-radius:999px;font-size:18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.bar button{font:inherit;font-weight:700;color:var(--fg);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.bar button:hover{border-color:var(--accent)}
.bar input[type=range]{flex:1 1 200px;min-width:0;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:9ch;text-align:right}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{color:var(--muted);font-size:13px;max-width:80ch}
</style>

<div class="wrap">
  <div>
    <h1>False Awakening, Scene 3</h1>
    <p class="sub">Ethan counts his fingers and finds the dream tell. He is still dreaming, and he cannot move. About 40 seconds. Turn the sound on and press play.</p>
  </div>
  <div class="frame">
    <canvas id="c" width="1280" height="720" aria-label="Animated horror scene: a dream, a false awakening and a silent kitchen"></canvas>
    <button class="big" id="big" aria-label="Play with sound"><span>Play with sound</span></button>
  </div>
  <div class="bar">
    <button id="pp">Play</button>
    <button id="rs">Restart</button>
    <input type="range" id="sc" min="0" max="40" step="0.01" value="0" aria-label="Timeline">
    <span class="time" id="tm">0.0 / 40.0s</span>
    <button id="fs">Full screen</button>
  </div>
  <p class="note">Work in progress test scene. The names and lines are placeholders you can change.</p>
</div>

<script>
(function(){

const gn=document.createElement('canvas');gn.width=gn.height=200;
(function(){const g=gn.getContext('2d'),d=g.createImageData(200,200);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0)})();
const off=document.createElement('canvas');
function withBlur(div,fn){

  const oc=off.getContext('2d');oc.setTransform(w/W,0,0,h/H,0,0);const prev=ctx;ctx=oc;fn();ctx=prev;ctx.imageSmoothingEnabled=true;ctx.drawImage(off,0,0,W,H);
}
function line(a,b,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}

const rgb=(c,k,a)=>'rgba('+Math.min(255,c[0]*k|0)+','+Math.min(255,c[1]*k|0)+','+Math.min(255,c[2]*k|0)+','+(a==null?1:a)+')';
const mix=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];

/* ---------- faces ---------- */
const SK_A='#f0c8a4',SK_D='#e2b490',SK_M='#efc4a0';
const EN={bY:0,bT:0,eye:1,smile:.05,open:0,skew:0,pup:1};
const EWARM={bY:-3,bT:-.2,eye:.82,smile:1,open:.1,skew:0,pup:1};
const EFADE={bY:2,bT:.25,eye:1.05,smile:.05,open:0,skew:0,pup:.85};
const EWORRY={bY:-4,bT:-.45,eye:1.15,smile:-.45,open:.1,skew:0,pup:.8};
const EFEAR={bY:-8,bT:-.4,eye:1.35,smile:-.2,open:.45,skew:0,pup:.55};
const EEAGER={bY:-3,bT:-.15,eye:1.05,smile:.5,open:.4,skew:0,pup:1};
const mixE=(a,b,k)=>{const r={};for(const n in a)r[n]=lerp(a[n],b[n],k);return r};
const ARUN={skin:SK_A,hair:'#4a2e1c',style:'spiky'};
const DAD={skin:SK_D,hair:'#8f8f93',style:'dad',mou:'#4a4646',glasses:1,wrinkle:1};
const MOM={skin:SK_M,hair:'#6a4529',style:'bun',wrinkle:.4};
function faceAt(x,y,R,p,look,blink,c){
  ctx.save();ctx.translate(x,y);ctx.scale(R/55,R/55);
  ctx.lineJoin='round';ctx.strokeStyle=INK;ctx.lineWidth=4;
  if(c.style==='bun'){ctx.fillStyle=c.hair;ctx.beginPath();ctx.arc(0,-62,22,0,7);ctx.fill();ctx.stroke()}
  ctx.fillStyle=c.skin;[-1,1].forEach(s=>{ctx.beginPath();ctx.arc(s*54,6,8,0,7);ctx.fill();ctx.stroke()});
  ctx.beginPath();ctx.arc(0,0,55,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=c.hair;
  if(c.style==='spiky'){
    ctx.beginPath();for(let i=0;i<=8;i++){const a=Math.PI*(1.04+.92*i/8);ctx.lineTo(Math.cos(a)*56,Math.sin(a)*56);
      if(i<8){const a2=Math.PI*(1.04+.92*(i+.5)/8),r=56+16+(i%3)*5;ctx.lineTo(Math.cos(a2)*r,Math.sin(a2)*r-2)}}
    ctx.lineTo(45,-18);ctx.quadraticCurveTo(16,-34,-8,-23);ctx.quadraticCurveTo(-30,-27,-47,-17);ctx.closePath();ctx.fill();
  }else{
    ctx.beginPath();ctx.arc(0,0,56.5,Math.PI*1.03,Math.PI*1.97);
    if(c.style==='dad'){ctx.quadraticCurveTo(30,-34,-6,-33);ctx.quadraticCurveTo(-34,-30,-52,-12)}
    else{ctx.quadraticCurveTo(14,-36,0,-30);ctx.quadraticCurveTo(-14,-36,-52,-12)}

  if(c.style==='bun'){ctx.fillStyle=c.hair;ctx.beginPath();ctx.arc(0,-60,22,0,7);ctx.fill();ctx.stroke()}
  ctx.fillStyle=c.skin;[-1,1].forEach(s=>{ctx.beginPath();ctx.arc(s*54,6,8,0,7);ctx.fill();ctx.stroke()});

  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(-6,-8,36,3.5,5.3);ctx.stroke();if(c.style==='bun'){ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2.5;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*9,-48);ctx.quadraticCurveTo(i*12,-10,i*8,40);ctx.stroke()}ctx.fillStyle='#d8a93a';ctx.beginPath();ctx.arc(0,-40,4,0,7);ctx.fill()}else{ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(8,-10,32,4.2,5.4);ctx.stroke()}

/* ---------- people ---------- */
const PANTS='#394150',SHOE='#14161a';
function limbH(o,a1,l1,a2,l2,dir,w1,w2,fill,end,k,sk){
  const m=[o[0]+Math.sin(a1)*l1*dir,o[1]+Math.cos(a1)*l1],e=[m[0]+Math.sin(a2)*l2*dir,m[1]+Math.cos(a2)*l2];

  if(end==='shoe'){ctx.fillStyle=sk;ctx.beginPath();ctx.ellipse(e[0]+dir*8*k,e[1]+2*k,15*k,7*k,0,0,7);ctx.fill();ctx.stroke()}
  else{ctx.fillStyle=sk;ctx.beginPath();ctx.arc(e[0],e[1],8.5*k,0,7);ctx.fill();ctx.stroke()}
}
function person(x,gy,k,o){
  const dir=o.dir||1,ph=o.ph||0,sk=o.c.skin,R=55*k*1.2;
  const bob=o.moving?-Math.abs(Math.sin(ph))*6*k:0;

  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,gy+4,52*k,7*k,0,0,7);ctx.fill();

  const sw=o.run?.95:.6,a=Math.sin(ph);

    if(o.pose==='stir'){const s2=Math.sin(o.st||0)*.12;limbH(S,sd*.5,40*k,sd*.5+1.0+s2,38*k,dir,16*k,14*k,o.top,'hand',k,sk)}

    else limbH(S,sd*.12,46*k,sd*.08,44*k,dir,16*k,14*k,o.top,'hand',k,sk)};

  if(o.skirt){
    ctx.beginPath();ctx.moveTo(hip[0]-24*k,hip[1]-8*k);ctx.lineTo(hip[0]+24*k,hip[1]-8*k);ctx.lineTo(hip[0]+44*k,gy-8*k);ctx.lineTo(hip[0]-44*k,gy-8*k);ctx.closePath();
    ctx.fillStyle=o.bottom;ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.stroke();
    ctx.fillStyle='#d8a93a';ctx.fillRect(hip[0]-43*k,gy-26*k,86*k,14*k);
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=3;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(hip[0]+i*9*k,hip[1]+10*k);ctx.lineTo(hip[0]+i*17*k,gy-28*k);ctx.stroke()}
    ctx.fillStyle=sk;[-1,1].forEach(s=>{ctx.beginPath();ctx.ellipse(hip[0]+s*14*k,gy-2*k,13*k,5*k,0,0,7);ctx.fill()});
  }else if(o.moving){
    limbH([hip[0]-7*k,hip[1]],-a*sw,60*k,-a*sw-Math.max(0,-Math.cos(ph))*.8-.05,58*k,dir,24*k,20*k,o.bottom,'shoe',k,sk);
    limbH([hip[0]+7*k,hip[1]],a*sw,60*k,a*sw-Math.max(0,Math.cos(ph))*.8-.05,58*k,dir,24*k,20*k,o.bottom,'shoe',k,sk)}
  else{limbH([hip[0]-7*k,hip[1]],-.08,60*k,-.08,58*k,dir,24*k,20*k,o.bottom,'shoe',k,sk);limbH([hip[0]+7*k,hip[1]],.08,60*k,.08,58*k,dir,24*k,20*k,o.bottom,'shoe',k,sk)}

  ctx.quadraticCurveTo(shr[0]+8*k,(sh[1]+hip[1])/2,hip[0]+25*k,hem);ctx.lineTo(hip[0]-25*k,hem);
  ctx.quadraticCurveTo(shl[0]-8*k,(sh[1]+hip[1])/2,shl[0]-6*k,sh[1]-6*k);ctx.closePath();
  ctx.fillStyle=o.top;ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.stroke();
  if(o.skirt&&o.back){ctx.fillStyle=o.bottom;ctx.beginPath();ctx.moveTo(shl[0]-6*k,sh[1]-4*k);ctx.lineTo(shl[0]+14*k,sh[1]-4*k);ctx.lineTo(hip[0]+26*k,hem+8*k);ctx.lineTo(hip[0]+4*k,hem+8*k);ctx.closePath();ctx.fill();ctx.stroke()}

/* ---------- first person hallway (pseudo 3D) ---------- */
const F=820,CX=W/2,CY=H/2+10;
function hall(camz,mode,tt,bob,endZ,fl){
  const dream=mode==='dream',HW=1.15,FL=-1.6,CE=1.15;
  const C=dream?{w:[236,194,146],f:[148,96,64],c:[246,224,192],glow:[255,230,176]}:{w:[168,184,198],f:[108,94,84],c:[208,214,222],glow:[238,222,196]};
  const far=dream?C.glow:[22,26,32];
  const P=(X,Y,d)=>[CX+X*F/d,CY-(Y-bob)*F/d];
  ctx.fillStyle=rgb(far,1);ctx.fillRect(0,0,W,H);
  const quad=(a,b,c,d,f)=>{ctx.fillStyle=f;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fill()};
  const dEnd=endZ-camz;
  if(dEnd>0){const d=Math.max(.4,dEnd),a=P(-HW,CE,d),b=P(HW,FL,d);
    const g=ctx.createRadialGradient(CX,CY,5,CX,CY,Math.max(60,(b[0]-a[0])*.8));
    if(dream){g.addColorStop(0,'rgb(255,248,225)');g.addColorStop(1,'rgb(255,214,140)')}else{g.addColorStop(0,'rgb(255,226,170)');g.addColorStop(1,'rgb(176,140,96)')}
    ctx.fillStyle=g;ctx.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1])}

  for(let k=K;k>=1;k--){
    const dNear=Math.max(.3,off2+2*(k-1)),dFar=Math.min(off2+2*k,dEnd);
    if(dNear>=dEnd)continue;
    const j=Math.floor((camz+(dNear+dFar)/2)/2);
    const fogK=1-Math.exp(-dFar/(dream?17:30));
    let b=dream?.9+.1*Math.min(1,(camz+dFar)/endZ):(((j%3)===0)?1.05:.72)*fl;
    const sh=(c,m)=>rgb(mix(c.map(v=>v*b*m),far,fogK*(dream?.85:.8)),1);
    quad(P(-HW,CE,dNear),P(-HW,CE,dFar),P(-HW,FL,dFar),P(-HW,FL,dNear),sh(C.w,1));
    quad(P(HW,CE,dNear),P(HW,CE,dFar),P(HW,FL,dFar),P(HW,FL,dNear),sh(C.w,.94));
    quad(P(-HW,FL,dNear),P(HW,FL,dNear),P(HW,FL,dFar),P(-HW,FL,dFar),sh(C.f,1));
    quad(P(-HW,CE,dNear),P(HW,CE,dNear),P(HW,CE,dFar),P(-HW,CE,dFar),sh(C.c,.95));
    quad(P(-HW,-1.2,dNear),P(-HW,-1.2,dFar),P(-HW,-1.35,dFar),P(-HW,-1.35,dNear),sh(C.w,.6));

    if(!dream&&(j%3)===0){const dn=dNear+.3,df=Math.max(dn+.2,dFar-.3);quad(P(-.4,CE-.01,dn),P(.4,CE-.01,dn),P(.4,CE-.01,df),P(-.4,CE-.01,df),rgb([250,252,255],clamp(fl*(1-fogK*.6),0,1)))}

      quad(P(-HW,.55,dn),P(-HW,.55,df),P(-HW,-.35,df),P(-HW,-.35,dn),sh([70,44,28],1));
      const i1=.05;quad(P(-HW,.5,dn+i1),P(-HW,.5,df-i1),P(-HW,-.3,df-i1),P(-HW,-.3,dn+i1),sh(dream?[225,205,170]:[200,196,188],1));
      if(j===3&&!dream){
        quad(P(-HW,.46,dn+.1),P(-HW,.46,df-.1),P(-HW,-.26,df-.1),P(-HW,-.26,dn+.1),sh([120,110,100],1));
        const a1=P(-HW,-.27,dn+.1),a2=P(-HW,-.27,df-.1);ctx.strokeStyle=rgb([245,240,230],b*(1-fogK*.5));ctx.lineWidth=Math.max(3,.09*F/dn);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a1[0],a1[1]);ctx.lineTo(a2[0],a2[1]);ctx.stroke();ctx.strokeStyle=rgb([230,120,140],b*(1-fogK*.5));ctx.lineWidth=Math.max(2,.04*F/dn);ctx.beginPath();ctx.moveTo(a1[0],a1[1]);ctx.lineTo(a2[0],a2[1]);ctx.stroke();

  withBlur(lerp(3,10,k/4),()=>bedroomWorld(D,0,0,'07:12'));
  ctx.fillStyle='rgba(20,10,30,'+(.2+.3*k/4)+')';ctx.fillRect(0,0,W,H);
  const r=lerp(760,40,ease(clamp(k/4.2,0,1)))*(1+.06*Math.sin(D*7)),g=ctx.createRadialGradient(W/2,H/2,r*.55,W/2,H/2,r);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#000';ctx.beginPath();ctx.rect(0,0,W,H);ctx.moveTo(W/2+r,H/2);ctx.arc(W/2,H/2,r,0,Math.PI*2);ctx.fill('evenodd');
}
/* ---------- subtitles ---------- */
// a sixth field 'vanish' makes the letters drop out one by one
const SUBS=[
  [1.2,3.4,'ETHAN','Okay...',ORANGE],
  [4.8,5.6,'ETHAN','One.',ORANGE],[5.7,6.5,'ETHAN','Two.',ORANGE],[6.6,7.4,'ETHAN','Three.',ORANGE],[7.5,8.3,'ETHAN','Four.',ORANGE],[8.4,9.6,'ETHAN','Five.',ORANGE],
  [10.2,12.8,'ETHAN','...Six.',ORANGE],
  [14.1,16.2,'ETHAN','Six fingers...',ORANGE],
  [16.6,18.9,'ETHAN',"I'm still dreaming.",ORANGE],
  [20.4,22,'ETHAN','Get up...',ORANGE],[22.6,24.2,'ETHAN','Get up!',ORANGE],[25,26.8,'ETHAN',"I can't move.",ORANGE],
  [28.3,33.8,'ETHAN','MOM! HELP ME!',ORANGE,'vanish']
];
function subText(s,tt){
  if(s[5]!=='vanish')return s[3];
  const k=clamp((tt-s[0]-1.2)/(s[1]-s[0]-1.6),0,1);
  return s[3].split('').map((ch,i)=>rnd(i*7.3+1)<k?' ':ch).join('');
}
function subtitle(tt){
  for(const s of SUBS){if(tt>=s[0]&&tt<s[1]){const txt=subText(s,tt);
    ctx.font='700 26px '+sans;const nm=s[2]+':  ',nw=ctx.measureText(nm).width;ctx.font='500 26px '+sans;const tw=ctx.measureText(s[3]).width;
    const x0=(W-(tw+nw))/2,y=H-BAR/2+2;ctx.textBaseline='middle';ctx.textAlign='left';
    ctx.font='700 26px '+sans;ctx.fillStyle=s[4];ctx.fillText(nm,x0,y);ctx.font='500 26px '+sans;ctx.fillStyle='#f4efe6';ctx.fillText(txt,x0+nw,y);ctx.textBaseline='alphabetic';break}}
}

/* ---------- master render ---------- */
function render(D){
  D=clamp(D,0,LEN);const tt=oMap(D);
  if(SHORT){ctx=sctx;ctx.setTransform(SS,0,0,SS,-(shortFx(tt)-CROP/2)*SS,0)}else ctx=main;
  ctx.save();
  if(tt<4)handsCalm(tt);
  else if(tt<13.5)countFingers(tt);
  else if(tt<19)realise(tt);
  else if(tt<27)stuckInBed(tt);
  else if(tt<35)silentScream(tt);
  else if(tt<44.4)fadeOut(tt);
  else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H)}
  ctx.restore();
  if(SHORT){composeShort(tt);return}
  if(tt<44.4){
    const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.07;ctx.drawImage(gn,Math.floor(rnd(D*40)*100)-100,Math.floor(rnd(D*40+3)*100)-100,W+200,H+200);ctx.globalAlpha=1;
  }
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,BAR);ctx.fillRect(0,H-BAR,W,BAR);
  subtitle(tt);
}

/* ---------- short video framing ---------- */
function shortFx(D){
  const cl=x=>clamp(x,CROP/2,W-CROP/2);
  return W/2;
}
function composeShort(tt){
  ctx=main;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,SW,SHH);
  ctx.imageSmoothingEnabled=true;ctx.drawImage(src,0,SBAR,SW,SPH);
  if(tt<44.4){const cy=SBAR+SPH/2,v=ctx.createRadialGradient(SW/2,cy,SW*.35,SW/2,cy,SPH*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,'+.5+')');ctx.fillStyle=v;ctx.fillRect(0,SBAR,SW,SPH);
    ctx.globalAlpha=.07;ctx.drawImage(gn,Math.floor(rnd(tt*40)*100)-100,SBAR+Math.floor(rnd(tt*40+3)*100)-100,SW+200,SPH+200);ctx.globalAlpha=1}
  ctx.fillStyle='#000';ctx.fillRect(0,0,SW,SBAR);ctx.fillRect(0,SHH-SBAR,SW,SBAR);
  for(const s of SUBS){if(tt>=s[0]&&tt<s[1]){
    const nm=s[2]+':  ',maxW=SW-64,lh=32;ctx.textBaseline='middle';ctx.textAlign='left';
    ctx.font='700 26px '+sans;const nw=ctx.measureText(nm).width;ctx.font='500 26px '+sans;
    const lines=[];let cur='';subText(s,tt).split(' ').forEach(w=>{const t2=cur?cur+' '+w:w;if(ctx.measureText(t2).width+(lines.length?0:nw)>maxW&&cur){lines.push(cur);cur=w}else cur=t2});lines.push(cur);
    const y0=SHH-SBAR/2-(lines.length-1)*lh/2;
    lines.forEach((ln,i)=>{ctx.font='500 26px '+sans;const lead=i?0:nw,x0=(SW-(ctx.measureText(ln).width+lead))/2;
      if(!i){ctx.font='700 26px '+sans;ctx.fillStyle=s[4];ctx.fillText(nm,x0,y0)}
      ctx.font='500 26px '+sans;ctx.fillStyle='#f4efe6';ctx.fillText(ln,x0+lead,y0+i*lh)});
    ctx.textBaseline='alphabetic';break}}
}

/* ---------- audio ---------- */
let AC=null,master,nb,padG,fanG,roomG,subG,tinG,fanLfo,evi=0,lastT=0,nextStep=0,nextBeat=0,nextNote=0,nextTick=0,nextBub=0;
function initAudio(){
  if(AC)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();
  master=AC.createGain();master.gain.value=.85;master.connect(AC.destination);
  nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  padG=AC.createGain();padG.gain.value=0;padG.connect(master);[146.8,220,277.2,369.9].forEach((f,i)=>{const o=AC.createOscillator();o.type=i%2?'triangle':'sine';o.frequency.value=f;const g=AC.createGain();g.gain.value=.4/(i+1);o.connect(g);g.connect(padG);o.start()});
  fanG=AC.createGain();fanG.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;const s=AC.createBufferSource();s.buffer=nb;s.loop=true;s.connect(lp);lp.connect(fanG);fanG.connect(master);s.start();
  fanLfo=AC.createOscillator();fanLfo.frequency.value=4.2;const lg=AC.createGain();lg.gain.value=.03;fanLfo.connect(lg);lg.connect(fanG.gain);fanLfo.start();
  roomG=AC.createGain();roomG.gain.value=0;roomG.connect(master);const ro=AC.createOscillator();ro.frequency.value=58;ro.connect(roomG);ro.start();
  subG=AC.createGain();subG.gain.value=0;const sl=AC.createBiquadFilter();sl.type='lowpass';sl.frequency.value=120;sl.connect(subG);subG.connect(master);[38,38.7].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(sl);o.start()});
  tinG=AC.createGain();tinG.gain.value=0;tinG.connect(master);const to=AC.createOscillator();to.frequency.value=5200;to.connect(tinG);to.start();
}
function nz(freq,q,dur,vol,type,delay){
  const s=AC.createBufferSource();s.buffer=nb;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();const n=AC.currentTime+(delay||0);
  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol,n+Math.min(.02,dur/3));g.gain.exponentialRampToValueAtTime(.0001,n+dur);s.connect(f);f.connect(g);g.connect(master);s.start(n,Math.random());s.stop(n+dur+.05);
}
function swell(f0,f1,dur,vol){const n=AC.currentTime,s=AC.createBufferSource();s.buffer=nb;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(f0,n);f.frequency.exponentialRampToValueAtTime(f1,n+dur);const g=AC.createGain();g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol,n+dur*.9);g.gain.linearRampToValueAtTime(0,n+dur);s.connect(f);f.connect(g);g.connect(master);s.start(n);s.stop(n+dur+.1)}
function thump(f,dur,vol){const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(30,n+dur);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);g.connect(master);o.start(n);o.stop(n+dur+.05)}
function bell(f,vol){const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+2.2);o.connect(g);g.connect(master);o.start(n);o.stop(n+2.3)}
function sting(vol){const n=AC.currentTime;[880,932,1244].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=3200;g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+1.1);o.connect(lp);lp.connect(g);g.connect(master);o.start(n);o.stop(n+1.2)})}
const tap=()=>nz(2600,5,.05,.18);
const SILENT=tt=>tt>=28.2&&tt<34.2;
const EVT=[
  ...COUNT.slice(0,5).map(t=>[t,tap]),
  [10.3,()=>{sting(.17);thump(42,.7,.9)}],
  [16.6,()=>swell(200,900,1.6,.12)],
  ...TRIES.map((t,i)=>[t,()=>{swell(150,700+i*300,.9,.12+i*.04);nz(500,1.2,.8,.05,'lowpass')}]),
  ...TRIES.map(t=>[t+.95,()=>thump(50,.3,.5)]),
  [28.2,()=>{master.gain.cancelScheduledValues(AC.currentTime);master.gain.setTargetAtTime(.85,AC.currentTime,.01)}],
  [44.4,()=>{master.gain.cancelScheduledValues(AC.currentTime);master.gain.setValueAtTime(0,AC.currentTime)}]
];
function audioUpdate(tt){
  if(!AC)return;const n=AC.currentTime,set=(g,v)=>g.gain.setTargetAtTime(v,n,SILENT(tt)?.01:.1);
  const sil=SILENT(tt);
  set(padG,0);
  set(fanG,!sil&&(tt<13.5||(tt>40&&tt<44.4))?.05:0);
  set(roomG,!sil&&tt<27?.012:0);
  set(subG,sil?0:tt>13.5&&tt<27?clamp((tt-13.5)/10,0,1)*.2:(tt>34.2&&tt<44.4)?.14:0);
  set(tinG,sil?.035:(tt>40&&tt<44.4)?clamp((tt-40)/4,0,1)*.025:0);
  if(playing){
    while(evi<EVT.length&&EVT[evi][0]<=tt){if(EVT[evi][0]>lastT-.001)EVT[evi][1]();evi++}
    // heartbeat: calming, absent while counting, racing after six, gone in the silent scream, slowing to a stop at the end
    let hb=0;
    if(tt<4)hb=lerp(.6,.85,tt/4);
    else if(tt>10.4&&tt<28.2)hb=lerp(.62,.48,clamp((tt-10.4)/17,0,1));
    else if(tt>=40&&tt<43.8)hb=lerp(.7,1.3,(tt-40)/3.8);
    if(hb&&tt>=nextBeat){thump(60,.18,.55);setTimeout(()=>{if(AC&&playing)thump(52,.2,.4)},hb*170);nextBeat=tt+hb}
  }
  lastT=tt;
}
function resetAudioTrackers(){const o=oMap(t);evi=0;while(evi<EVT.length&&EVT[evi][0]<o)evi++;lastT=o;nextStep=nextBeat=nextNote=nextTick=nextBub=o;if(AC&&master)master.gain.setValueAtTime(o>=44.4?0:.85,AC.currentTime)}

/* ---------- UI ---------- */
const pp=document.getElementById('pp'),rs=document.getElementById('rs'),sc=document.getElementById('sc'),tm=document.getElementById('tm'),big=document.getElementById('big'),fs=document.getElementById('fs');
function ui(){pp.textContent=playing?'Pause':(t>=LEN?'Replay':'Play');sc.value=t;tm.textContent=t.toFixed(1)+' / '+LEN.toFixed(1)+'s';big.hidden=playing||t>0.01}
function play(){initAudio();if(AC&&AC.state==='suspended')AC.resume();if(t>=LEN)t=0;resetAudioTrackers();playing=true;ui()}
function pause(){playing=false;if(master&&AC)master.gain.setTargetAtTime(.0001,AC.currentTime,.05);ui()}
pp.onclick=()=>{if(playing)pause();else play()};
big.onclick=play;
rs.onclick=()=>{t=0;play()};
sc.oninput=()=>{t=parseFloat(sc.value);resetAudioTrackers();ui()};
fs.onclick=()=>{const el=cv.parentElement;try{(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch(()=>{})}catch(e){}};
let last=performance.now();
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){t+=dt;if(t>=LEN){t=LEN;playing=false}ui()}
  render(t);audioUpdate(oMap(t));requestAnimationFrame(tick)}
window.__seek=v=>{t=v;render(t)};
ui();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(tick));
})();
</script>
