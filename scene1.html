<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>False Awakening - Scene 1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#000;display:block}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(0,0,0,.8);color:#e8e2d6;font:600 22px system-ui,Arial;cursor:pointer;letter-spacing:.04em;text-align:center}
#ov small{font:400 14px system-ui,Arial;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div id="ovt">CLICK TO PLAY WITH SOUND</div><small>Scene 1 &middot; about 51 seconds &middot; Space to pause &middot; R to restart</small></div>
<script>
(()=>{
const W=1280,H=720,BAR=64,SH=H-2*BAR,CX=W/2,CY=SH/2,DUR=51,TAU=Math.PI*2;
const OL='#1c1e26';
const cv=document.getElementById('c'),c=cv.getContext('2d');
cv.width=W;cv.height=H;

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function fillOL(fill,lw=5){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=OL;c.lineJoin='round';c.stroke()}
function capOut(x1,y1,x2,y2,w,lw=5){c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=OL;c.lineWidth=w+lw*2;c.stroke()}
function capFill(x1,y1,x2,y2,w,fill){c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=fill;c.lineWidth=w;c.stroke()}
function cap(x1,y1,x2,y2,w,fill,lw=5){capOut(x1,y1,x2,y2,w,lw);capFill(x1,y1,x2,y2,w,fill)}
function glow(x,y,r,rgba,mode='screen'){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba);g.addColorStop(1,rgba.replace(/[\d.]+\)$/,'0)'));c.save();c.globalCompositeOperation=mode;c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore()}
function lin(x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}

/* ---------- characters ---------- */
const ETHAN={skin:'#e8b894',shirt:'#8a8f9a',pants:'#2f3d57',hair:'#5a3b26',kind:'ethan'};
const DAD={skin:'#e3b08c',shirt:'#8f4a3a',pants:'#2b2d36',hair:'#b8bcc4',kind:'dad',long:true};
const MOM={skin:'#e8b894',shirt:'#7a8f6a',pants:'#3d4f6b',hair:'#6b4a32',kind:'mom',long:true};

function face(o,e){
  const brow=e.brow||0,eye=e.eye==null?1:e.eye,pup=e.pup==null?1:e.pup,op=e.open||0,sm=e.smile||0,lk=e.look||0,bl=e.blink||0;
  [-1,1].forEach(i=>{
    const ex=i*17,ey=-254;
    if(bl>0.85){c.beginPath();c.moveTo(ex-9,ey+2);c.lineTo(ex+9,ey+2);c.lineWidth=4;c.strokeStyle=OL;c.lineCap='round';c.stroke()}
    else{
      c.beginPath();c.ellipse(ex,ey,9.5*eye,(9.5*eye)*(1-bl*0.9),0,0,TAU);c.fillStyle='#f7f4ee';c.fill();c.lineWidth=3.5;c.strokeStyle=OL;c.stroke();
      c.beginPath();c.arc(ex+lk*4,ey+1,4.2*pup*Math.min(eye,1.2),0,TAU);c.fillStyle=OL;c.fill();
    }
    // brows
    const by=-272-(eye-1)*8;
    c.beginPath();c.moveTo(i*7,by-brow*8);c.lineTo(i*30,by+brow*8+(e.browOut||0));c.lineWidth=6;c.lineCap='round';c.strokeStyle=o.kind==='dad'?'#8d9099':'#3a2616';c.stroke();
    if(e.stress){c.lineWidth=2.6;c.strokeStyle=OL;for(let k=-1;k<=1;k++){c.beginPath();c.moveTo(i*29,ey+k*5);c.lineTo(i*36,ey+k*7+1);c.stroke()}}
  });
  // nose
  c.beginPath();c.moveTo(-2,-246);c.quadraticCurveTo(-6,-236,1,-236);c.lineWidth=3.2;c.strokeStyle=OL;c.lineCap='round';c.stroke();
  // mouth
  if(op>0.05){c.beginPath();c.ellipse(0,-224+op*3,9+op*6,2.5+op*13,0,0,TAU);c.fillStyle='#5a2430';c.fill();c.lineWidth=3.5;c.strokeStyle=OL;c.stroke()}
  else{c.beginPath();c.moveTo(-11,-224);c.quadraticCurveTo(0,-224+sm*10,11,-224);c.lineWidth=4;c.strokeStyle=OL;c.lineCap='round';c.stroke()}
  if(e.sweat){c.beginPath();c.moveTo(38,-278);c.quadraticCurveTo(46,-262,38,-258);c.quadraticCurveTo(30,-262,38,-278);c.fillStyle='#b9d6f2';c.fill();c.lineWidth=2.5;c.strokeStyle=OL;c.stroke()}
}

function person(o){
  const s=o.s||1,skin=o.skin,back=!!o.back,ph=o.walk||0,A=o.arms||[0.12,0.12],F=o.fore||A;
  c.save();c.translate(o.x,o.y);c.scale(o.flip?-s:s,s);
  if(o.shadow){c.beginPath();c.ellipse(0,4,90,14,0,0,TAU);c.fillStyle='rgba(20,15,10,.28)';c.fill()}
  if(o.rot)c.rotate(o.rot);
  if(o.cut!=null){c.beginPath();c.rect(-500,-900,1000,900+o.cut);c.clip()}
  const sw=o.stride==null?0.5:o.stride;
  // legs
  const legs=[-1,1].map(i=>{const p=ph+(i<0?0:Math.PI),a=Math.sin(p)*sw,hx=i*17,hy=-118,lift=Math.max(0,Math.cos(p))*(o.lift||0);return{hx,hy,fx:hx+Math.sin(a)*112,fy:hy+Math.cos(a)*112-lift}});
  legs.forEach(l=>capOut(l.hx,l.hy,l.fx,l.fy,28));
  legs.forEach(l=>capFill(l.hx,l.hy,l.fx,l.fy,28,o.pants));
  legs.forEach(l=>{c.beginPath();c.ellipse(l.fx+(back?0:2),l.fy+6,23,12,0,0,TAU);fillOL('#2b2c34',4.5)});
  rr(-38,-132,76,28,10);fillOL(o.pants);
  // torso
  rr(-38,-208,76,94,26);fillOL(o.shirt);
  c.save();rr(-38,-208,76,94,26);c.clip();
  if(o.kind==='dad'){
    c.lineWidth=4;c.strokeStyle='#6e3326';[-26,-8,10,28].forEach(x=>{c.beginPath();c.moveTo(x,-210);c.lineTo(x,-112);c.stroke()});
    [-188,-162,-136].forEach(y=>{c.beginPath();c.moveTo(-40,y);c.lineTo(40,y);c.stroke()});
    c.lineWidth=2.5;c.strokeStyle='#b06a55';[-17,1,19].forEach(x=>{c.beginPath();c.moveTo(x,-210);c.lineTo(x,-112);c.stroke()});
    if(!back){c.beginPath();c.moveTo(0,-206);c.lineTo(0,-114);c.lineWidth=3;c.strokeStyle=OL;c.stroke()}
  }else if(o.kind==='mom'){
    if(!back){c.fillStyle='#d8dccb';c.beginPath();c.moveTo(-16,-208);c.lineTo(16,-208);c.lineTo(8,-150);c.lineTo(-8,-150);c.closePath();c.fill();
      c.lineWidth=3.5;c.strokeStyle=OL;c.beginPath();c.moveTo(-16,-208);c.lineTo(-6,-114);c.moveTo(16,-208);c.lineTo(6,-114);c.stroke()}
    else{c.lineWidth=3;c.strokeStyle='#5f7352';c.beginPath();c.moveTo(-38,-124);c.lineTo(38,-124);c.stroke()}
  }else{
    c.beginPath();c.arc(0,-210,15,0,Math.PI);c.lineWidth=4;c.strokeStyle='#6c717c';c.stroke();
  }
  c.restore();
  rr(-38,-208,76,94,26);c.lineWidth=5;c.strokeStyle=OL;c.stroke();
  // arms
  const arms=[-1,1].map((i,k)=>{const a=A[k],f=F[k],sx=i*40,sy=-192,ex=sx+i*Math.sin(a)*54,ey=sy+Math.cos(a)*54;return{i,sx,sy,ex,ey,hx:ex+i*Math.sin(f)*50,hy:ey+Math.cos(f)*50}});
  arms.forEach(m=>{capOut(m.sx,m.sy,m.ex,m.ey,22);capOut(m.ex,m.ey,m.hx,m.hy,20)});
  arms.forEach(m=>{capFill(m.sx,m.sy,m.ex,m.ey,22,o.shirt);capFill(m.ex,m.ey,m.hx,m.hy,20,o.long?o.shirt:skin)});
  arms.forEach(m=>{c.beginPath();c.arc(m.hx,m.hy,15,0,TAU);fillOL(skin,4.5)});
  if(o.mug){const m=arms[o.mug===-1?0:1];rr(m.hx-14,m.hy-34,30,36,7);fillOL('#d9d3c4',4.5);c.beginPath();c.arc(m.hx+18,m.hy-16,9,-1.2,1.2);c.lineWidth=5;c.strokeStyle=OL;c.stroke();
    c.fillStyle='#4a2f1e';c.fillRect(m.hx-11,m.hy-31,24,6);o.mugPos=[m.hx,m.hy-34]}
  // head
  if(o.kind==='mom'){c.beginPath();c.arc(0,-300,21,0,TAU);fillOL(o.hair)}
  rr(-12,-226,24,28,6);fillOL(skin,4.5);
  [-1,1].forEach(i=>{c.beginPath();c.arc(i*43,-250,11,0,TAU);fillOL(skin,4.5)});
  c.beginPath();c.arc(0,-252,44,0,TAU);fillOL(skin);
  if(back){
    c.beginPath();c.arc(0,-254,45,0,TAU);fillOL(o.hair);
    if(o.kind==='ethan'){for(let k=0;k<7;k++){const th=-Math.PI*(0.12+0.76*k/6);spike(th,66)}}
    if(o.kind==='mom'){c.beginPath();c.arc(0,-300,21,0,TAU);fillOL(o.hair);c.beginPath();c.moveTo(-20,-286);c.lineTo(20,-286);c.lineWidth=5;c.strokeStyle='#4a2f1e';c.stroke()}
    if(o.kind==='dad'){c.beginPath();c.moveTo(-34,-226);c.quadraticCurveTo(0,-206,34,-226);c.lineWidth=3;c.strokeStyle='#8d9099';c.stroke();
      c.lineWidth=2.5;c.strokeStyle='#8d9099';for(let k=-4;k<=4;k++){c.beginPath();c.moveTo(k*8,-292+Math.abs(k)*2);c.quadraticCurveTo(k*11,-262,k*10,-232+Math.abs(k)*3);c.stroke()}}
  }else{
    c.save();c.beginPath();c.rect(-70,-330,140,56);c.clip();c.beginPath();c.arc(0,-254,47,0,TAU);fillOL(o.hair);c.restore();
    if(o.kind==='ethan'){for(let k=0;k<7;k++){const th=-Math.PI*(0.12+0.76*k/6);spike(th,66)}
      c.beginPath();c.arc(0,-254,47,0,TAU);c.save();c.clip();c.beginPath();c.rect(-60,-330,120,54);c.fillStyle=o.hair;c.fill();c.restore()}
    if(o.kind==='mom'){[-1,1].forEach(i=>{c.beginPath();c.moveTo(i*38,-280);c.quadraticCurveTo(i*52,-250,i*42,-228);c.lineTo(i*36,-232);c.quadraticCurveTo(i*40,-256,i*30,-276);c.closePath();fillOL(o.hair,4)})}
    if(o.kind==='dad'){[-1,1].forEach(i=>{c.beginPath();c.ellipse(i*41,-262,7,15,i*0.2,0,TAU);fillOL(o.hair,4)})}
    face(o,o.expr||{});
    if(o.kind==='dad'){
      [-1,1].forEach(i=>{c.beginPath();c.arc(i*19,-254,16,0,TAU);c.fillStyle='rgba(255,255,255,.18)';c.fill();c.lineWidth=4;c.strokeStyle=OL;c.stroke()});
      c.beginPath();c.moveTo(-3,-254);c.lineTo(3,-254);c.stroke();
      c.beginPath();c.moveTo(-17,-231);c.quadraticCurveTo(0,-240,17,-231);c.quadraticCurveTo(0,-224,-17,-231);fillOL('#a5a9b2',3.5);
    }
  }
  c.restore();
}
function spike(th,len){const bx=Math.cos(th)*43,by=-254+Math.sin(th)*43,tx=Math.cos(th+0.1)*len,ty=-254+Math.sin(th+0.1)*len,n=0.2;
  c.beginPath();c.moveTo(Math.cos(th-n)*43,-254+Math.sin(th-n)*43);c.lineTo(tx,ty);c.lineTo(Math.cos(th+n)*43,-254+Math.sin(th+n)*43);c.closePath();fillOL('#5a3b26',4.5)}

/* ---------- pseudo 3D hallway ---------- */
function hall(P,camZ,fx){
  const F=520,zEnd=fx.zEnd,vx=CX+(fx.sway||0),vy=CY-10+(fx.bob||0),Wd=190,top=-175,flo=150;
  const pr=(x,y,z)=>{z=Math.max(z,6);const k=F/z;return[vx+x*k,vy+y*k,k]};
  const quad=(pts,fill,ol)=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();if(ol){c.lineWidth=ol;c.strokeStyle=OL;c.lineJoin='round';c.stroke()}};
  const zf=zEnd-camZ;
  c.fillStyle=P.back;c.fillRect(-100,-100,W+200,SH+200);
  quad([pr(-Wd,top,6),pr(Wd,top,6),pr(Wd,top,zf),pr(-Wd,top,zf)],P.ceil);
  quad([pr(-Wd,flo,6),pr(Wd,flo,6),pr(Wd,flo,zf),pr(-Wd,flo,zf)],P.floor);
  quad([pr(-Wd,top,6),pr(-Wd,flo,6),pr(-Wd,flo,zf),pr(-Wd,top,zf)],P.wallL);
  quad([pr(Wd,top,6),pr(Wd,flo,6),pr(Wd,flo,zf),pr(Wd,top,zf)],P.wallR);
  quad([pr(-70,flo,6),pr(70,flo,6),pr(70,flo,zf),pr(-70,flo,zf)],P.runner);
  [-1,1].forEach(s=>quad([pr(s*Wd,flo-22,6),pr(s*Wd,flo,6),pr(s*Wd,flo,zf),pr(s*Wd,flo-22,zf)],P.trim));
  // end wall
  const a=pr(-Wd,top,zf),b=pr(Wd,flo,zf);
  c.fillStyle=P.end;c.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
  const d1=pr(-60,-120,zf),d2=pr(60,flo,zf);
  c.fillStyle=P.endDoor;c.fillRect(d1[0],d1[1],d2[0]-d1[0],d2[1]-d1[1]);
  c.lineWidth=4;c.strokeStyle=OL;c.strokeRect(d1[0],d1[1],d2[0]-d1[0],d2[1]-d1[1]);
  // items far to near
  const items=fx.items.slice().sort((p,q)=>q.z-p.z);
  items.forEach(it=>{
    const z1=it.z-camZ,z2=it.z+it.len-camZ;if(z2<10||z1>zf+5)return;
    const s=it.side,x=s*Wd,k=F/Math.max(z1,10),lw=clamp(3.2*k/1.6,1.2,8);
    if(it.type==='door'){
      quad([pr(x,-125,z1-6),pr(x,-125,z2+6),pr(x,flo,z2+6),pr(x,flo,z1-6)],P.trim,lw);
      quad([pr(x,-115,z1),pr(x,-115,z2),pr(x,flo,z2),pr(x,flo,z1)],P.door,lw);
      quad([pr(x,-95,z1+12),pr(x,-95,z2-12),pr(x,-15,z2-12),pr(x,-15,z1+12)],P.doorIn,lw*.6);
      quad([pr(x,5,z1+12),pr(x,5,z2-12),pr(x,125,z2-12),pr(x,125,z1+12)],P.doorIn,lw*.6);
      const kn=pr(x,40,z2-9);c.beginPath();c.arc(kn[0],kn[1],Math.max(2,5*kn[2]/1.5),0,TAU);fillOL('#d9c28a',lw*.5);
    }else if(it.type==='frame'){
      quad([pr(x,-75,z1),pr(x,-75,z2),pr(x,-5,z2),pr(x,-5,z1)],P.frame,lw);
      quad([pr(x,-66,z1+6),pr(x,-66,z2-6),pr(x,-14,z2-6),pr(x,-14,z1+6)],P.pic[it.pic%P.pic.length],lw*.5);
      quad([pr(x,-40,z1+14),pr(x,-40,z1+30),pr(x,-14,z1+30),pr(x,-14,z1+14)],P.picB,0);
    }else if(it.type==='lamp'){
      quad([pr(-34,top+1,z1),pr(34,top+1,z1),pr(34,top+1,z2),pr(-34,top+1,z2)],P.lamp,lw*.6);
    }
  });
  glow(vx,vy,fx.fogR||620,P.fog);
  if(P.bloomEnd){const e=pr(0,0,zf);glow(e[0],e[1],fx.bloomR||320,P.bloomEnd)}
  return[vx,vy];
}
const DREAM_HALL={back:'#e9cda0',ceil:'#ecd3a8',floor:'#8c6b4b',wallL:'#d6ae82',wallR:'#d0a77b',runner:'#b5523f',trim:'#f1dfbb',end:'#f3e2bd',endDoor:'#fff7de',door:'#a9744d',doorIn:'#92603c',frame:'#f1dfbb',pic:['#8aa0a8','#c88a6a','#9a8f6a'],picB:'#5e5a4a',lamp:'#fff2c8',fog:'rgba(255,228,180,0.6)',bloomEnd:'rgba(255,240,200,0.85)'};
const COOL_HALL={back:'#56627a',ceil:'#8c97ab',floor:'#444c60',wallL:'#7c889e',wallR:'#76829a',runner:'#5a6a8a',trim:'#a9b3c4',end:'#9aa7bb',endDoor:'#f4e6bd',door:'#59657e',doorIn:'#4c5870',frame:'#a9b3c4',pic:['#6c7f93','#8b7f78','#7d8b78'],picB:'#4c5568',lamp:'#e6eefb',fog:'rgba(190,205,235,0.38)',bloomEnd:'rgba(255,236,190,0.7)'};
const HALL_ITEMS=[];
[['door',-1,230,80],['frame',1,300,55],['lamp',0,180,50],['frame',-1,400,55],['door',1,470,80],['lamp',0,420,50],['frame',1,610,55],['door',-1,650,80],['lamp',0,660,50],['frame',-1,790,55],['door',1,820,80],['lamp',0,900,50],['door',-1,980,80],['frame',1,1000,55]]
  .forEach((a,i)=>HALL_ITEMS.push({type:a[0],side:a[1],z:a[2],len:a[3],pic:i}));

/* ---------- misc props ---------- */
function steam(x,y,u,n,sc,alpha=0.5){
  c.save();c.lineCap='round';
  for(let i=0;i<n;i++){
    const ph=(u*0.5+i/n)%1,yy=y-ph*130*sc,xx=x+Math.sin(u*1.7+i*2.1+ph*5)*10*sc*(0.4+ph)+ (i-n/2)*7*sc;
    c.globalAlpha=alpha*Math.sin(ph*Math.PI)*0.9;c.strokeStyle='#f2eee6';c.lineWidth=7*sc*(1-ph*0.4);
    c.beginPath();c.moveTo(xx,yy);c.quadraticCurveTo(xx+10*sc*Math.sin(u*2+i),yy-20*sc,xx-4*sc,yy-42*sc);c.stroke();
  }
  c.restore();
}
function dust(u,n,col='rgba(255,240,205,0.7)',w=W,h=SH){
  c.save();c.fillStyle=col;
  for(let i=0;i<n;i++){const x=(hash(i)*w+Math.sin(u*0.5+i)*30+u*(6+hash(i+9)*10))%w,y=(hash(i+50)*h-u*(5+hash(i+3)*8)+h*4)%h,r=1.2+hash(i+7)*2.6;
    c.globalAlpha=0.25+0.5*hash(i+20)*(0.5+0.5*Math.sin(u*1.3+i));c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
  c.restore();
}
function blobs(y,r,col,off,step=95){c.fillStyle=col;for(let i=-1;i<16;i++){const rr_=r*(0.7+0.6*hash(i+off));c.beginPath();c.ellipse(i*step+hash(i+off+3)*40,y-rr_*0.2,rr_*0.9,rr_,0,0,TAU);c.fill()}c.fillRect(-100,y,W+200,200)}
function clockFace(x,y,r,hh,mm,ss){
  c.beginPath();c.arc(x,y,r,0,TAU);fillOL('#ecebe4',Math.max(3,r/10));
  c.lineCap='round';c.strokeStyle=OL;
  for(let i=0;i<12;i++){const a=i/12*TAU;c.lineWidth=Math.max(2,r/18);c.beginPath();c.moveTo(x+Math.sin(a)*r*0.8,y-Math.cos(a)*r*0.8);c.lineTo(x+Math.sin(a)*r*0.9,y-Math.cos(a)*r*0.9);c.stroke()}
  const ha=((hh%12)+mm/60)/12*TAU,ma=mm/60*TAU;
  c.lineWidth=Math.max(3,r/9);c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.sin(ha)*r*0.5,y-Math.cos(ha)*r*0.5);c.stroke();
  c.lineWidth=Math.max(2.5,r/13);c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.sin(ma)*r*0.74,y-Math.cos(ma)*r*0.74);c.stroke();
  c.strokeStyle='#b3352c';c.lineWidth=Math.max(1.5,r/24);const sa=ss/60*TAU;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.sin(sa)*r*0.8,y-Math.cos(sa)*r*0.8);c.stroke();
  c.beginPath();c.arc(x,y,r/16,0,TAU);c.fillStyle='#b3352c';c.fill();
}
function digital(x,y,sc,txt,t,col='#ff5a3c'){
  c.save();c.translate(x,y);c.scale(sc,sc);

  person(Object.assign({},MOM,{x:CX,y:800,s:1.9,back:true,arms:[0.25,0.4],fore:[0.25,-0.7+Math.sin(u*1.8)*0.15],rot:Math.sin(u*0.5)*0.004}));
  c.restore();
}

/* ---------- shot dispatcher + whip pans ---------- */
function shotAt(t){
  if(t<T.A[1])return shotA(t);
  if(t<T.B[1])return shotB(t);
  if(t<T.C[1])return shotC(t);
  if(t<T.E[1])return shotE(t);
  if(t<T.F[1])return shotF(t);
  if(t<T.G[1])return shotG(t);
  if(t<T.R[1])return shotR(t);
  if(t<T.H[1])return shotH(t);
  if(t<T.K[1])return shotK(t);
  if(t<T.I[1])return shotI(t);
  if(t<DUR-2)return shotJ(t);
}
const WHIPS=[T.R[0],T.H[0]];
function drawShot(t){
  c.fillStyle='#000';c.fillRect(0,0,W,SH);
  const wb=WHIPS.find(b=>Math.abs(t-b)<0.2);
  if(wb===undefined){shotAt(t);return}
  const p=(t-wb)/0.2; // -1..1
  const dx=p<0?-ease(1+p)*W*0.7:(1-ease(p))*W*0.7;
  const n=7;
  for(let i=0;i<n;i++){
    c.save();c.globalAlpha=i===0?1:1/(i+1);
    c.translate(dx+(i-n/2)*Math.sign(dx||1)*18,0);
    shotAt(p<0?t:Math.max(t,wb));
    c.restore();
  }
  c.save();c.globalCompositeOperation='screen';c.fillStyle='rgba(255,255,255,'+(0.12*(1-Math.abs(p)))+')';c.fillRect(0,0,W,SH);c.restore();
}

/* ---------- post: grade, vignette, grain, bars, subtitles ---------- */
const grainTex=[];
for(let k=0;k<6;k++){const g=document.createElement('canvas');g.width=1280;g.height=592;const gc=g.getContext('2d'),id=gc.createImageData(1280,592);
  for(let i=0;i<id.data.length;i+=4){const v=128+(Math.random()+Math.random()-1)*120;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gc.putImageData(id,0,0);grainTex.push(g)}
function grade(t){
  const dream=t<18.4,whiteMix=0;
  c.save();
  if(dream){c.globalCompositeOperation='soft-light';c.fillStyle='rgba(255,196,120,0.5)';c.fillRect(0,0,W,SH);
    c.globalCompositeOperation='screen';c.fillStyle='rgba(255,214,160,0.08)';c.fillRect(0,0,W,SH)}
  else{c.globalCompositeOperation='multiply';c.fillStyle='rgb(208,220,244)';c.fillRect(0,0,W,SH)}
  c.restore();
  // vignette
  const g=c.createRadialGradient(CX,CY,SH*0.35,CX,CY,W*0.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+(dream?0.55:0.75)+')');c.fillStyle=g;c.fillRect(0,0,W,SH);
}
function whiteAlpha(t){
  if(t<16.6)return 0;if(t<17.9)return ease(seg(t,16.6,17.9));if(t<18.4)return 1;return 1-ease(seg(t,18.4,19.7));
}
function subtitle(t){
  const L=LINES.find(l=>t>=l.t0-0.1&&t<=l.t1);if(!L)return;
  const a=Math.min(seg(t,L.t0-0.1,L.t0+0.15),1-seg(t,L.t1-0.3,L.t1));
  c.save();c.globalAlpha=a;c.font='600 26px "Segoe UI",system-ui,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle=L.col;
  c.fillText(L.who+':  '+L.text,CX,H-BAR/2);c.restore();
}
function fadeEnds(t){
  const k=1-ease(seg(t,DUR-2.2,DUR-2));
  if(t>=DUR-2){c.fillStyle='#000';c.fillRect(0,0,W,SH)}
}
function render(t){
  t=clamp(t,0,DUR-0.001);
  c.fillStyle='#000';c.fillRect(0,0,W,H);
  c.save();c.translate(0,BAR);c.beginPath();c.rect(0,0,W,SH);c.clip();
  drawShot(t);
  const wa=whiteAlpha(t);
  if(t>=DUR-2){c.fillStyle='#000';c.fillRect(0,0,W,SH)}
  else{
    grade(t);
    if(wa>0){c.fillStyle='rgba(255,250,235,'+wa+')';c.fillRect(0,0,W,SH)}
    if(t<T.A[0]+0.8){c.fillStyle='rgba(0,0,0,'+(1-seg(t,0,0.8))+')';c.fillRect(0,0,W,SH)}
    // grain
    c.save();c.globalCompositeOperation='overlay';c.globalAlpha=0.16;
    const gi=Math.floor(t*14)%6;c.drawImage(grainTex[gi],Math.floor(hash(Math.floor(t*14))*60)-30,0);c.restore();
  }
  c.restore();
  c.fillStyle='#000';c.fillRect(0,0,W,BAR);c.fillRect(0,H-BAR,W,BAR);
  subtitle(t);
}

/* ---------- sound (all synthesised) ---------- */
let AC=null,t0=0,masterG=null;
function buildAudio(){
  const ac=AC;t0=ac.currentTime+0.15;
  const comp=ac.createDynamicsCompressor();masterG=ac.createGain();masterG.gain.value=0.85;masterG.connect(comp);comp.connect(ac.destination);
  const out=ac.createGain();out.connect(masterG);
  const dly=ac.createDelay(1);dly.delayTime.value=0.34;const fb=ac.createGain();fb.gain.value=0.42;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  dly.connect(lp);lp.connect(fb);fb.connect(dly);const wet=ac.createGain();wet.gain.value=0.55;lp.connect(wet);wet.connect(masterG);
  const send=ac.createGain();send.connect(dly);
  const T0=x=>t0+x;
  masterG.gain.setValueAtTime(0.85,T0(48.99));masterG.gain.setValueAtTime(0.0001,T0(49));
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  function G(t,a,d,pk,hold=0,dst=out){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.setValueAtTime(pk,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+d);g.connect(dst);return g}
  function tone(type,f,t,a,d,pk,{hold=0,f2,wetAmt=0,dst}={}){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+hold+d);const g=G(t,a,d,pk,hold,dst||out);o.connect(g);if(wetAmt){const s=ac.createGain();s.gain.value=wetAmt;g.connect(s);s.connect(send)}o.start(t);o.stop(t+a+hold+d+0.1)}
  function noise(t,a,d,pk,{type='lowpass',f=800,q=1,f2,hold=0}={}){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+a+hold+d);fl.Q.value=q;const g=G(t,a,d,pk,hold,out);s.connect(fl);fl.connect(g);s.start(t,Math.random());s.stop(t+a+hold+d+0.1)}
  function bell(t,f,pk){[[1,1],[2.76,0.35],[5.4,0.15]].forEach(p=>tone('sine',f*p[0],t,0.005,3.2/p[0]**0.5,pk*p[1],{wetAmt:0.8}))}
  function voice(t,f0,dur,pk){const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0*1.06,t);o.frequency.linearRampToValueAtTime(f0*0.94,t+dur);
    const g=G(t,0.02,dur*0.7,pk,dur*0.2);[[650,4],[1700,6]].forEach(fm=>{const b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=fm[0];b.Q.value=fm[1];o.connect(b);b.connect(g)});o.start(t);o.stop(t+dur+0.4)}
  // dream drone and bells
  [55,82.4,110.5].forEach((f,i)=>tone(i?'triangle':'sine',f,T0(0),3,3,0.07-i*0.015,{hold:12.5}));
  [0.8,3.6,5.9,8.3,10.6,13.2,15.5].forEach((t,i)=>bell(T0(t),[659,784,880,659,988,784,523][i],0.075));
  // footsteps hall
  for(let t=0.6;t<7.4;t+=0.58)noise(T0(t),0.005,0.09,0.2,{f:220});
  // wind on porch
  noise(T0(7.5),2,3,0.05,{type:'bandpass',f:420,q:0.6,hold:6});
  // heartbeat build
  let hb=14.4,gap=0.85;while(hb<17.9){tone('sine',58,T0(hb),0.01,0.16,0.55,{f2:40});tone('sine',52,T0(hb+0.16),0.01,0.14,0.4,{f2:38});hb+=gap;gap=Math.max(0.5,gap-0.045)}
  noise(T0(16.4),1.4,0.5,0.18,{type:'bandpass',f:300,q:1,f2:5000});tone('sine',440,T0(16.6),1.2,0.5,0.06,{f2:1320});
  // wake: breath, fan, heartbeat
  noise(T0(19.3),0.7,0.7,0.1,{type:'bandpass',f:1300,q:0.7});
  [19.7,20.35,21.0,21.7].forEach((t,i)=>{tone('sine',60,T0(t),0.01,0.15,0.5);tone('sine',54,T0(t+0.15),0.01,0.13,0.36)});
  noise(T0(18.4),1.5,5,0.07,{f:260,hold:6});tone('sine',95,T0(18.8),1.5,1,0.035,{hold:5});
  // clock ticks
  for(let t=22.4;t<49;t+=1){tone('square',t%2<1?3200:2600,T0(t),0.001,0.025,0.02)}
  // whips
  [26.1,29.4].forEach(t=>noise(T0(t),0.12,0.18,0.22,{type:'bandpass',f:500,q:0.8,f2:4500}));
  // run footsteps and breath
  for(let t=26.4;t<29.5;t+=0.27)noise(T0(t),0.004,0.07,0.28,{type:'bandpass',f:900,q:0.8});
  [26.6,27.4,28.2].forEach(t=>noise(T0(t),0.25,0.3,0.07,{type:'bandpass',f:1500,q:0.8}));
  // kitchen room tone, kettle hiss, fridge hum
  noise(T0(29.6),1,19,0.03,{f:380,hold:0});noise(T0(30),3,16,0.018,{type:'highpass',f:4500,hold:0});tone('sine',60,T0(29.6),1,1,0.04,{hold:18});
  // dread drone
  tone('sawtooth',41,T0(34),8,6,0.07,{hold:0});tone('sawtooth',43.5,T0(34),8,6,0.05,{hold:0});tone('sine',82,T0(36),6,3,0.06,{hold:0});
  // voices
  LINES.forEach((L,li)=>L.syl.forEach(s=>voice(T0(L.t0+s[0]),li?210:128,s[1],0.12)));
  for(let t=37.6;t<43;t+=0.62){tone('sine',55,T0(t),0.01,0.16,0.3);tone('sine',50,T0(t+0.16),0.01,0.14,0.2)}
}

/* ---------- player ---------- */
const ov=document.getElementById('ov'),ovt=document.getElementById('ovt');
const q=new URLSearchParams(location.search);
let playing=false,pausedAt=0,startPerf=0,still=q.has('t');
function now(){if(AC&&AC.state!=='closed')return AC.currentTime-t0;return (performance.now()-startPerf)/1000}
function start(){
  ov.style.display='none';
  try{AC=new (window.AudioContext||window.webkitAudioContext)();buildAudio()}catch(e){AC=null;startPerf=performance.now()}
  playing=true;requestAnimationFrame(loop);
}
function loop(){
  if(!playing)return;
  const t=now();render(t);
  if(t>=DUR){playing=false;ov.style.display='flex';ovt.textContent='REPLAY';if(AC){AC.close();AC=null}return}
  requestAnimationFrame(loop);
}
ov.addEventListener('click',()=>{if(AC){AC.close();AC=null}start()});
addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){playing=false;if(AC){AC.close();AC=null}start()}
  if(e.key===' '&&AC){e.preventDefault();if(AC.state==='running')AC.suspend();else AC.resume()}
});
window.renderAt=t=>{render(t)};
if(still){ov.style.display='none';render(parseFloat(q.get('t'))||0)}
else render(0.5);
})();
</script>
